{% extends "checklist/_layout.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block nav %}{% with active='pw' %}{% include "checklist/_nav_user.html" %}{% endwith %}{% endblock %}
{% block content %}
<section class="ck-auth">
  <h1>비밀번호 변경</h1>
  <form method="post" class="ck-card ck-form">
    <input type="hidden" name="csrf" value="{{ csrf }}" />
    <label>지금 비밀번호<input name="cur" type="password" required autocomplete="current-password" /></label>
    <label>새 비밀번호 ({{ min_pw }}자 이상)<input name="pw1" type="password" minlength="{{ min_pw }}" required autocomplete="new-password" /></label>
    <label>한 번 더<input name="pw2" type="password" minlength="{{ min_pw }}" required autocomplete="new-password" /></label>
    <button class="ck-btn">바꾸기</button>
  </form>
</section>
{% endblock %}
