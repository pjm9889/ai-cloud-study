{% extends "checklist/_layout.html" %}
{% block title %}비밀번호 정하기{% endblock %}
{% block content %}
<section class="ck-auth">
  <h1>{{ u.name }}님, 비밀번호를 정하세요</h1>
  <p class="ck-sub">다음부터는 이름과 이 비밀번호로 들어옵니다. 잊어버리면 강사에게 초기화를 요청하세요.</p>
  <form method="post" class="ck-card ck-form">
    <label>새 비밀번호 ({{ min_pw }}자 이상)<input name="pw1" type="password" minlength="{{ min_pw }}" required autocomplete="new-password" /></label>
    <label>한 번 더<input name="pw2" type="password" minlength="{{ min_pw }}" required autocomplete="new-password" /></label>
    <button class="ck-btn">정하고 시작하기</button>
  </form>
</section>
{% endblock %}
