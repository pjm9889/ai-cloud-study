<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ site.site_name }} | {{ page_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">{{ site.site_name }}</a>
      <nav class="main-nav" aria-label="주요 메뉴">
        {% for team in site.teams %}<a href="{{ team.domain }}" target="_blank" rel="noreferrer">{{ team.name }}</a>{% endfor %}
        <a href="/guide">프로젝트가이드</a>
      </nav>
      <div class="account">관리자님 <span>My 프로젝트</span><span>관리센터</span></div>
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="container footer">{{ site.site_name }} · {{ site.project_name }} 메인 홈페이지</footer>
</body>
</html>
