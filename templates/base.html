<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ site.site_name }} | {{ page_title }}</title>
  <link rel="stylesheet" href="/static/css/site.css?v=20261020-2" />
  {% if page_title == '메인' %}<link rel="stylesheet" href="/static/css/home.css?v=20261020-1" />{% endif %}
</head>
<body class="{% if page_title == '메인' %}home-page{% endif %}">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><span class="brand-mark">AI</span><span>{{ site.site_name }}</span></a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="/">홈</a>
        <a href="/#lecture-materials">교안</a>
        <a href="/guide">프로젝트가이드</a>
      </nav>
    </div>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="container footer">{{ site.site_name }} · {{ site.project_name }} 메인 홈페이지</footer>
</body>
</html>
