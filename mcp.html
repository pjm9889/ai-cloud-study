<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Naver Blog MCP | BSSBU AI Studio</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #eef7ff; background: #07111f; --line: #254661; --muted: #91a9bd; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0, #183c65, transparent 36%), #07111f; }
      .wrap { width: min(980px, 100%); margin: auto; padding: 24px; }
      .top, .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .top { margin-bottom: 32px; }
      .btn { border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; color: #fff; background: #102943; font-weight: 750; cursor: pointer; }
      .primary { border-color: #3a83c7; background: #216fb8; }
      .box { border: 1px solid var(--line); border-radius: 18px; padding: 24px; background: #0b1929e8; margin-bottom: 16px; }
      .login { max-width: 440px; margin: 14vh auto; }
      input, textarea { width: 100%; margin: 7px 0 14px; padding: 12px; border: 1px solid #2a4d6c; border-radius: 8px; color: #fff; background: #071523; }
      textarea { min-height: 130px; resize: vertical; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .wide { grid-column: 1 / -1; }
      label { display: block; color: var(--muted); font-size: .88rem; }
      .result { margin-top: 12px; padding: 12px; border-radius: 8px; color: #bceee2; background: #0e3037; white-space: pre-wrap; overflow: auto; }
      small, p { color: var(--muted); line-height: 1.55; }
      #workspace { display: none; }
      @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } .wrap { padding: 14px; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="box login" id="loginBox">
        <h1>네이버 블로그 MCP</h1>
        <p>상품소개 표준화와 초안 관리를 위한 보호된 페이지입니다.</p>
        <label for="password">MCP 비밀번호</label>
        <input id="password" type="password" autocomplete="off" placeholder="비밀번호 입력" />
        <button class="btn primary" id="loginBtn">확인</button>
        <div class="result" id="loginResult">인증 대기</div>
      </section>
      <section id="workspace">
        <header class="top">
          <div><small>BSSBU AI STUDIO / MCP</small><h1>네이버 블로그 상품소개</h1></div>
          <button class="btn" id="backBtn">← 메인으로</button>
        </header>
        <section class="box">
          <h2>상품 정보 표준화</h2>
          <div class="grid">
            <label>상품명<input id="product_name" required /></label>
            <label>카테고리<input id="category" /></label>
            <label>가격<input id="price" /></label>
            <label>상태<input id="condition" placeholder="새상품, 사용감 적음 등" /></label>
            <label class="wide">추천 대상<input id="target_customer" /></label>
            <label class="wide">주요 특징<textarea id="selling_points" placeholder="한 줄에 하나씩 입력"></textarea></label>
            <label class="wide">상세 정보<textarea id="features" placeholder="한 줄에 하나씩 입력"></textarea></label>
            <label>사용 방법<input id="usage" /></label>
            <label>거래/배송<input id="shipping_or_location" /></label>
            <label>문의<input id="contact" /></label>
          </div>
          <div class="actions"><button class="btn primary" id="standardizeBtn">표준화 미리보기</button><button class="btn" id="draftBtn">초안 저장</button></div>
          <div class="result" id="contentResult">상품 정보를 입력하세요.</div>
        </section>
        <section class="box"><h2>저장된 초안</h2><button class="btn" id="refreshBtn">새로고침</button><div class="result" id="draftsResult">조회 대기</div></section>
      </section>
    </main>
    <script>
      let secret = "";
      const $ = (s) => document.querySelector(s);
      const fields = ["product_name","category","price","condition","target_customer","usage","shipping_or_location","contact"];
      function payload() {
        const p = Object.fromEntries(fields.map((id) => [id, $("#" + id).value]));
        p.selling_points = $("#selling_points").value.split("\n").map((x) => x.trim()).filter(Boolean);
        p.features = $("#features").value.split("\n").map((x) => x.trim()).filter(Boolean);
        return p;
      }
      async function call(path, options = {}) {
        const headers = { "Content-Type": "application/json", "x-mcp-password": secret, ...(options.headers || {}) };
        const res = await fetch("/api/mcp/naver-blog" + path, { ...options, headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "요청에 실패했습니다.");
        return data;
      }
      $("#loginBtn").onclick = async () => {
        secret = $("#password").value;
        try { await call("/login", { method: "POST" }); $("#loginBox").style.display = "none"; $("#workspace").style.display = "block"; loadDrafts(); }
        catch (e) { $("#loginResult").textContent = e.message; secret = ""; }
      };
      $("#standardizeBtn").onclick = async () => { try { const x = await call("/standardize", { method: "POST", body: JSON.stringify(payload()) }); $("#contentResult").textContent = x.title + "\n\n" + x.body; } catch (e) { $("#contentResult").textContent = e.message; } };
      $("#draftBtn").onclick = async () => { try { const x = await call("/drafts", { method: "POST", body: JSON.stringify(payload()) }); $("#contentResult").textContent = "초안 저장 완료\n" + x.title + "\n\n" + x.body; loadDrafts(); } catch (e) { $("#contentResult").textContent = e.message; } };
      async function loadDrafts() { try { const x = await call("/drafts"); $("#draftsResult").textContent = x.length ? x.map((d) => `[${d.status}] ${d.draft_id} — ${d.title}\n${d.body}`).join("\n\n---\n\n") : "저장된 초안이 없습니다."; } catch (e) { $("#draftsResult").textContent = e.message; } }
      $("#refreshBtn").onclick = loadDrafts;
      $("#backBtn").onclick = () => { window.location.href = "/"; };
    </script>
  </body>
</html>
