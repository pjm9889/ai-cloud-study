name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backup FastAPI entrypoint
        shell: bash
        run: |
          test -s index.html
          grep -q '<html' index.html
          test -s main.py
          test -s admin.html
          test -s mcp.html
          test -s guide.html
          grep -q "@app.get('/admin')" main.py
          grep -q "@app.get('/mcp')" main.py
          grep -q "@app.get('/guide')" main.py

      - name: Package static website
        uses: actions/upload-artifact@v4
        with:
          name: gabia-homepage
          path: |
            index.html
            README.md
