name: Deploy to Gabia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Upload homepage to Gabia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage
        shell: bash
        run: |
          test -s main.py
          test -s index.html
          test -s requirements.txt

      - name: Upload files over SSH/SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "mkdir -p -- '$GABIA_TARGET_DIR'"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          files = [
              'main.py', 'index.html', 'gpt_module.py', 'naver_blog_routes.py',
              'admin.html', 'mcp.html', 'requirements.txt', 'README.md',
              'templates/home.html',
          ]
          with zipfile.ZipFile('gabia-deploy.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for path in files:
                  z.write(path, path)
              for path in Path('data').glob('*'):
                  if path.is_file() and path.suffix.lower() in {'.jpg', '.jpeg', '.png'}:
                      z.write(path, path.as_posix())
          PY
          base64 -w 0 gabia-deploy.zip \
            | sshpass -e ssh \
              -o StrictHostKeyChecking=no \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o PubkeyAuthentication=no \
              -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
              "cd '$GABIA_TARGET_DIR' && python3 -c 'import sys,zipfile,io,base64; zipfile.ZipFile(io.BytesIO(base64.b64decode(sys.stdin.buffer.read()))).extractall(\".\")'"

      - name: Restart FastAPI application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR'; python3 -m pip install --user -r requirements.txt; python3 -c 'import main, uvicorn; print(\"imports ok\")'; killall -9 python3 || true; sleep 3; nohup python3 -m uvicorn main:app --host 0.0.0.0 --port 8080 > app.log 2>&1 < /dev/null &"

      - name: Verify running application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sleep 8
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR' && (curl -fsS http://127.0.0.1:8080/ | grep -q 'BSSBU AI Studio' || (echo '--- remote directory ---'; pwd; ls -la; echo '--- main markers ---'; grep -n 'BSSBU Vision Ops\|BSSBU AI Studio' main.py index.html || true; echo '--- processes ---'; ps -ef | grep -E 'python|uvicorn' | grep -v grep || true; echo '--- app.log ---'; tail -80 app.log 2>/dev/null || true; exit 1))"

      - name: Collect Gabia diagnostics
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set +e
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR'; echo '--- directory ---'; pwd; ls -la; echo '--- app markers ---'; grep -n 'FastAPI\|프로젝트 허브' app.py; echo '--- processes ---'; ps -ef | grep -E 'python|uvicorn' | grep -v grep; echo '--- local guide ---'; curl -i http://127.0.0.1:8080/guide; echo '--- app.log ---'; tail -100 app.log" > gabia-diagnostic.txt 2>&1
          cat gabia-diagnostic.txt

      - name: Upload Gabia diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gabia-diagnostic
          path: gabia-diagnostic.txt

      - name: Publish diagnostic snapshot
        if: always()
        shell: bash
        run: |
          set +e
          cp gabia-diagnostic.txt "$RUNNER_TEMP/gabia-diagnostic.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gabia-diagnostic
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/gabia-diagnostic.txt" gabia-diagnostic.txt
          git add gabia-diagnostic.txt
          git commit -m "Record Gabia deployment diagnostic" >/dev/null 2>&1 || true
          git push origin HEAD:gabia-diagnostic --force

