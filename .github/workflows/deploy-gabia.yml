name: Deploy to Gabia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload homepage to Gabia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage
        shell: bash
        run: |
          test -s app.py
          test -s requirements.txt
          test -s templates/home.html
          test -s templates/guide.html
          test -s data/site.json

      - name: Upload files over SSH/SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "mkdir -p -- '$GABIA_TARGET_DIR'"
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            app.py main.py requirements.txt README.md \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
          sshpass -e scp -r \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            templates static data \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"

      - name: Restart FastAPI application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR' && python3 -m pip install --user -r requirements.txt && python3 -c 'import app, uvicorn, gunicorn; print(\"imports ok\")' && (fuser -k 8080/tcp || true) && (pkill -f 'gunicorn' || true) && (pkill -f 'uvicorn' || true) && (pkill -f '[m]ain.py' || true) && (pkill -f '[a]pp.py' || true) && nohup python3 -m gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8080 app:app --access-logfile app-access.log --error-logfile app.log --daemon"

      - name: Verify running application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sleep 10
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR' && (curl -fsS http://127.0.0.1:8080/guide | grep -q '프로젝트가이드' || (echo '--- remote directory ---'; pwd; ls -la; echo '--- app.py markers ---'; grep -n 'FastAPI\|프로젝트 허브' app.py || true; echo '--- processes ---'; ps -ef | grep -E 'python|uvicorn' | grep -v grep || true; echo '--- app.log ---'; tail -80 app.log 2>/dev/null || true; exit 1))"

      - name: Collect Gabia diagnostics
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set +e
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR'; echo '--- directory ---'; pwd; ls -la; echo '--- app markers ---'; grep -n 'FastAPI\|프로젝트 허브' app.py; echo '--- processes ---'; ps -ef | grep -E 'python|uvicorn' | grep -v grep; echo '--- local guide ---'; curl -i http://127.0.0.1:8080/guide; echo '--- app.log ---'; tail -100 app.log" > gabia-diagnostic.txt 2>&1
          cat gabia-diagnostic.txt

      - name: Upload Gabia diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gabia-diagnostic
          path: gabia-diagnostic.txt
