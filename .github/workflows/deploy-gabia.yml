name: Deploy to Gabia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Upload homepage to Gabia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage
        shell: bash
        run: |
          test -s app.py
          test -s main.py
          test -s requirements.txt
          test -s templates/home.html
          test -s templates/guide.html
          test -s data/site.json
          test -s checklist_routes.py
          test -s data/checklist_items.yaml
          test -s static/css/checklist.css
          test -n "$(find templates/checklist -maxdepth 1 -type f -name '*.html' -print -quit)"

      - name: Upload files over SSH/SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "mkdir -p -- '$GABIA_TARGET_DIR' && cd '$GABIA_TARGET_DIR' && curl -fsSL 'https://github.com/pjm9889/ai-cloud-study/archive/refs/heads/main.zip' -o /tmp/ai-cloud-study-main.zip && python3 -c 'import os,pathlib,zipfile; p=\"/tmp/ai-cloud-study-main.zip\"; z=zipfile.ZipFile(p); prefix=z.namelist()[0].split(\"/\",1)[0]+\"/\"; wanted=(\"main.py\",\"requirements.txt\",\"checklist_routes.py\",\"templates/home.html\",\"templates/checklist/\",\"static/css/checklist.css\",\"data/checklist_items.yaml\",\"lecture_materials/index.html\",\"lecture_materials/part-a.html\",\"lecture_materials/part-b.html\",\"lecture_materials/B1/\",\"lecture_materials/B2/\",\"lecture_materials/B3/\",\"lecture_materials/B4/\"); [pathlib.Path(w).unlink() for w in (\"lecture_materials/B1\",\"lecture_materials/B2\",\"lecture_materials/B3\",\"lecture_materials/B4\") if pathlib.Path(w).is_file()]; [(pathlib.Path(r:=n[len(prefix):]).parent.mkdir(parents=True,exist_ok=True), pathlib.Path(r).write_bytes(z.read(n))) for n in z.namelist() if n.startswith(prefix) and not n.endswith(\"/\") and any(n[len(prefix):]==w or n[len(prefix):].startswith(w) for w in wanted)]; z.close(); os.remove(p)'"
      - name: Restart FastAPI application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR'; set -e; if [ -f .env ]; then while IFS= read -r envline; do case \"\$envline\" in ADMIN_PASSWORD=*|CHECKLIST_COOKIE_SECURE=*|CHECKLIST_SECRET=*) export \"\$envline\";; esac; done < .env; fi; export CHECKLIST_COOKIE_SECURE=\"\${CHECKLIST_COOKIE_SECURE:-1}\"; python3 -m pip install --user -r requirements.txt; python3 -c 'import main, uvicorn; print(\"imports ok\")'; python3 -c 'import os,signal,subprocess; lines=subprocess.check_output([\"ps\",\"-eo\",\"pid=,comm=,args=\"], text=True).splitlines(); [os.kill(int(parts[0]), signal.SIGTERM) for line in lines if len(parts:=line.strip().split(None,2)) == 3 and parts[1] == \"python3\" and parts[2].startswith(\"python3 -m uvicorn main:app --host 0.0.0.0 --port 8080\") and int(parts[0]) != os.getpid()]'; sleep 2; setsid python3 -m uvicorn main:app --host 0.0.0.0 --port 8080 > app.log 2>&1 < /dev/null & sleep 4"

      - name: Verify running application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sleep 8
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR'; if [ -f .env ]; then while IFS= read -r envline; do case \"\$envline\" in ADMIN_PASSWORD=*|CHECKLIST_COOKIE_SECURE=*|CHECKLIST_SECRET=*) export \"\$envline\";; esac; done < .env; fi; export CHECKLIST_COOKIE_SECURE=\"\${CHECKLIST_COOKIE_SECURE:-1}\"; test \"\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/checklist/)\" = 200 && test \"\$(curl -fsS http://127.0.0.1:8080/checklist/ | grep -c 'GPT 없이')\" -ge 1 && test \"\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/checklist/admin/login)\" = 200 && test \"\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/static/css/checklist.css)\" = 200 && test \"\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)\" = 200 && test \"\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/guide)\" = 200 && test \"\$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/a1-m1)\" = 200 && test -f data/checklist.db && python3 -c 'import os; print(\"ADMIN_PASSWORD set:\", bool(os.getenv(\"ADMIN_PASSWORD\"))); print(\"CHECKLIST_COOKIE_SECURE:\", os.getenv(\"CHECKLIST_COOKIE_SECURE\", \"<unset>\")); print(\"CHECKLIST_SECRET set:\", bool(os.getenv(\"CHECKLIST_SECRET\")))' || (echo '--- remote directory ---'; pwd; find data -maxdepth 1 -type f -printf '%f\\n' 2>/dev/null || true; echo '--- processes ---'; ps -ef | grep -E 'python|uvicorn' | grep -v grep || true; echo '--- app.log ---'; tail -80 app.log 2>/dev/null || true; exit 1)"

      - name: Collect Gabia diagnostics
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set +e
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR'; echo '--- directory ---'; pwd; ls -la; echo '--- app markers ---'; grep -n 'FastAPI\|프로젝트 허브' app.py; echo '--- processes ---'; ps -ef | grep -E 'python|uvicorn' | grep -v grep; echo '--- local guide ---'; curl -i http://127.0.0.1:8080/guide; echo '--- app.log ---'; tail -100 app.log" > gabia-diagnostic.txt 2>&1
          cat gabia-diagnostic.txt

      - name: Upload Gabia diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gabia-diagnostic
          path: gabia-diagnostic.txt

      - name: Publish diagnostic snapshot
        if: always()
        shell: bash
        run: |
          set +e
          cp gabia-diagnostic.txt "$RUNNER_TEMP/gabia-diagnostic.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gabia-diagnostic
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/gabia-diagnostic.txt" gabia-diagnostic.txt
          git add gabia-diagnostic.txt
          git commit -m "Record Gabia deployment diagnostic" >/dev/null 2>&1 || true
          git push origin HEAD:gabia-diagnostic --force

