name: Deploy to Gabia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload homepage to Gabia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage
        shell: bash
        run: |
          test -s index.html
          grep -q '<html' index.html

      - name: Upload files over SSH/SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "mkdir -p -- '$GABIA_TARGET_DIR'"
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            index.html app.py requirements.txt README.md \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"

      - name: Restart FastAPI application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR' && python3 -m pip install --user -r requirements.txt && (pkill -f '[u]vicorn app:app' || true) && nohup python3 -m uvicorn app:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &"
