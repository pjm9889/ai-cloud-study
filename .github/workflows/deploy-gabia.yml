name: Deploy to Gabia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload homepage to Gabia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage
        shell: bash
        run: |
          python3 -m pip install --quiet jinja2
          python3 build_static.py
          test -s public/index.html
          test -s public/guide.html
          test -s public/static/css/site.css

      - name: Upload files over SSH/SCP
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "mkdir -p -- '$GABIA_TARGET_DIR'"
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            public/index.html \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            public/guide.html \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            public/guide \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            app.py requirements.txt \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
          sshpass -e scp -r \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            templates static data \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "test -s '$GABIA_TARGET_DIR/guide.html' && test -s '$GABIA_TARGET_DIR/guide'"

      - name: Start and verify FastAPI application
        shell: bash
        env:
          SSHPASS: ${{ secrets.GABIA_PASSWORD }}
          GABIA_HOST: ${{ secrets.GABIA_HOST }}
          GABIA_USERNAME: ${{ secrets.GABIA_USERNAME }}
          GABIA_PORT: ${{ secrets.GABIA_PORT || 22 }}
          GABIA_TARGET_DIR: ${{ secrets.GABIA_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "cd '$GABIA_TARGET_DIR' && python3 -m pip install --user -r requirements.txt && (pkill -f '[u]vicorn app:app' || true) && nohup python3 -m uvicorn app:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &"
          sleep 3
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -p "$GABIA_PORT" "$GABIA_USERNAME@$GABIA_HOST" \
            "python3 -c \"import urllib.request; data=urllib.request.urlopen('http://127.0.0.1:8080/guide.html').read(); assert '프로젝트가이드'.encode() in data\""
          sshpass -e scp -r \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAuthentication=no \
            -P "$GABIA_PORT" \
            public/static \
            "$GABIA_USERNAME@$GABIA_HOST:$GABIA_TARGET_DIR/"
