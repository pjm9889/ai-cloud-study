<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDE 채용 공고 검색</title>
<style>
:root{--ink:#14213d;--muted:#68758a;--line:#dbe3ee;--bg:#f5f7fb;--card:#fff;--accent:#1769e0;--accent-soft:#eaf2ff;--green:#10875a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Malgun Gothic",sans-serif;line-height:1.6}.wrap{max-width:1180px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:38px}.brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--accent)}.home{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-weight:700}.hero{margin-bottom:24px}.hero h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.055em;line-height:1.12;margin:0 0 12px}.hero p{color:var(--muted);margin:0;max-width:720px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #243b5b0a}.filters{display:grid;grid-template-columns:1fr 170px 170px auto;gap:10px}.input,.select,.button{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font:inherit;background:#fff;color:var(--ink)}.input:focus,.select:focus{outline:3px solid #1769e024;border-color:var(--accent)}.button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800;cursor:pointer}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px;color:var(--muted);font-size:14px}.meta strong{color:var(--ink);font-size:17px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cfe0fa;background:var(--accent-soft);color:#1558b2;border-radius:99px;padding:4px 10px;font-size:13px}.results{display:grid;gap:12px}.job{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.job-head{display:flex;justify-content:space-between;gap:14px}.rank{color:var(--accent);font-weight:900;font-size:14px}.job h2{font-size:20px;line-height:1.35;letter-spacing:-.025em;margin:3px 0 5px}.company{font-weight:750}.sub{color:var(--muted);font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{font-size:13px;padding:3px 8px;border-radius:6px;background:#f1f4f8;color:#4e5e73}.detail{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin-top:14px;font-size:14px}.detail dt{color:var(--muted);font-weight:750}.detail dd{margin:0;white-space:pre-line}.links{display:flex;gap:9px;margin-top:16px}.links a{font-size:14px;color:var(--accent);font-weight:750;text-decoration:none}.empty,.loading{padding:42px 12px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px}.page{min-width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}.page.active{background:var(--ink);color:#fff;border-color:var(--ink)}.source{font-size:12px;color:var(--muted);margin-top:22px}.source a{color:var(--accent)}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .input{grid-column:1/-1}.filters .button{grid-column:1/-1}.job-head{display:block}.detail{grid-template-columns:1fr;gap:1px}.detail dt{margin-top:8px}.wrap{padding:20px 14px 50px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="brand">BSSBU · DATA SEARCH</div></div><a class="home" href="/lectures/files/index.html">← 강의자료 라이브러리</a></header>
<section class="hero"><h1>FDE 채용 공고 검색</h1><p>구조화된 JobKorea 검색 데이터를 공고명, 회사, 지역, 업무, 자격요건, 우대사항까지 한 번에 검색하세요.</p></section>
<section class="panel">
<div class="filters"><input id="q" class="input" type="search" placeholder="예: FDE, LLM, Python, 고객 문제 정의" autocomplete="off"><select id="region" class="select"><option value="">전체 지역</option></select><select id="career" class="select"><option value="">전체 경력</option></select><button id="reset" class="button" type="button">초기화</button></div>
<div class="meta"><div><strong id="count">불러오는 중…</strong> <span>개 공고</span></div><div id="updated"></div></div><div id="chips" class="chips"></div><div id="results" class="results"><div class="loading">CSV 데이터를 불러오는 중입니다.</div></div><nav id="pager" class="pager" aria-label="검색 결과 페이지"></nav><p class="source">데이터 파일: <a href="/lectures/files/jobkorea_fde_ontology_search_structured.csv">jobkorea_fde_ontology_search_structured.csv</a></p>
</section></main>
<script>
const CSV_URL='/lectures/files/jobkorea_fde_ontology_search_structured.csv';
const state={rows:[],page:1,size:8};
const $=id=>document.getElementById(id);
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const out=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell);out.push(row);row=[];cell='';}else if(c!=='\r')cell+=c;}if(cell!==''||row.length){row.push(cell);out.push(row)}const headers=out.shift();return out.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}
function fillSelect(id,key){const values=[...new Set(state.rows.map(r=>r[key]).filter(Boolean))];values.sort((a,b)=>a.localeCompare(b,'ko'));$(id).innerHTML='<option value="">전체 '+(key==='지역'?'지역':'경력')+'</option>'+values.map(v=>`<option>${esc(v)}</option>`).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function text(r){return Object.values(r).join(' ').toLowerCase()}
function filtered(){const q=$('q').value.trim().toLowerCase(),reg=$('region').value,career=$('career').value;return state.rows.filter(r=>(!q||text(r).includes(q))&&(!reg||r['지역']===reg)&&(!career||r['경력']===career))}
function render(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.size;const rows=all.slice(start,start+state.size);$('count').textContent=all.length.toLocaleString();$('results').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">조건에 맞는 공고가 없습니다.<br>검색어 또는 필터를 바꿔 보세요.</div>';renderPager(pages);renderChips();}
function card(r){const tags=[r['지역'],r['경력'],r['직무/업종']].filter(Boolean).map(v=>`<span class="tag">${esc(v)}</span>`).join('');return `<article class="job"><div class="job-head"><div><div class="rank">검색 순위 ${esc(r['순위'])}</div><h2>${esc(r['공고명'])}</h2><div class="company">${esc(r['회사'])}</div></div><div class="sub">${esc(r['등록일'])} 등록</div></div><div class="tags">${tags}</div><dl class="detail"><dt>주요업무</dt><dd>${esc(r['주요업무'])}</dd><dt>필수자격</dt><dd>${esc(r['필수자격'])}</dd><dt>우대사항</dt><dd>${esc(r['우대사항'])}</dd><dt>복지·조건</dt><dd>${esc(r['기타조건/복지'])}</dd></dl><div class="links"><a href="${esc(r['공고URL'])}" target="_blank" rel="noopener">공고 원문 →</a>${r['검색URL']?`<a href="${esc(r['검색URL'])}" target="_blank" rel="noopener">검색 결과 →</a>`:''}</div></article>`}
function renderPager(pages){$('pager').innerHTML=pages<=1?'':Array.from({length:pages},(_,i)=>`<button class="page ${i+1===state.page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');document.querySelectorAll('.page').forEach(b=>b.onclick=()=>{state.page=+b.dataset.page;render();scrollTo({top:300,behavior:'smooth'})})}
function renderChips(){const q=$('q').value.trim(),r=$('region').value,c=$('career').value;$('chips').innerHTML=[q&&`검색어: ${esc(q)}`,r&&esc(r),c&&esc(c)].filter(Boolean).map(v=>`<span class="chip">${v}</span>`).join('')}
['q','region','career'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{state.page=1;render()}));$('reset').onclick=()=>{$('q').value='';$('region').value='';$('career').value='';state.page=1;render()};
fetch(CSV_URL).then(r=>{if(!r.ok)throw Error('CSV load failed');return r.text()}).then(t=>{state.rows=parseCSV(t);fillSelect('region','지역');fillSelect('career','경력');const dates=state.rows.map(r=>r['작성일']).filter(Boolean);$('updated').textContent=dates.length?'기준일 '+dates[0]:'';render()}).catch(()=>{$('count').textContent='0';$('results').innerHTML='<div class="empty">CSV를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>'});
</script></body></html>
