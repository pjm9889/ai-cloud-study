<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>잡코리아 채용공고 검색</title>
<style>
:root{--ink:#14213d;--muted:#68758a;--line:#dbe3ee;--bg:#f5f7fb;--card:#fff;--accent:#1769e0;--soft:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Malgun Gothic",sans-serif;line-height:1.55}.wrap{max-width:1440px;margin:auto;padding:28px 22px 64px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-size:14px;font-weight:850;letter-spacing:.08em;color:var(--accent)}.home{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-weight:700}.hero{margin-bottom:22px}.hero h1{font-size:clamp(30px,4vw,50px);letter-spacing:-.055em;line-height:1.1;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #243b5b0a}.filters{display:grid;grid-template-columns:minmax(220px,1.5fr) 170px minmax(180px,1fr) 170px 150px auto;gap:9px}.control{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}.control:focus{outline:3px solid #1769e024;border-color:var(--accent)}.button{border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;padding:0 16px;cursor:pointer}.summary{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0 11px;color:var(--muted);font-size:14px}.summary strong{color:var(--ink);font-size:18px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.jobs{border-collapse:collapse;width:100%;min-width:1160px;font-size:14px}.jobs th{position:sticky;top:0;background:#f1f5fa;color:#42536d;font-size:13px;text-align:left;white-space:nowrap;padding:12px 11px;border-bottom:1px solid var(--line)}.jobs td{vertical-align:top;padding:13px 11px;border-bottom:1px solid #e9eef5}.jobs tbody tr:hover{background:#f8fbff}.jobs tbody tr:last-child td{border-bottom:0}.rank{color:var(--accent);font-weight:850;white-space:nowrap}.title{font-weight:800;min-width:210px}.title a{color:var(--ink);text-decoration:none}.title a:hover{color:var(--accent)}.company{font-weight:700;min-width:130px}.muted{color:var(--muted);white-space:nowrap}.jobtext{min-width:290px;max-width:410px;white-space:normal}.badge{display:inline-block;background:var(--soft);color:#1558b2;border-radius:99px;padding:3px 8px;white-space:nowrap;font-size:12px}.empty,.loading{padding:45px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;gap:6px;margin-top:18px}.page{min-width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.page.active{background:var(--ink);border-color:var(--ink);color:#fff}.source{font-size:12px;color:var(--muted);margin:18px 0 0}.source a{color:var(--accent)}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .keyword{grid-column:1/-1}.filters .button{min-height:44px}}@media(max-width:560px){.wrap{padding:20px 13px 50px}.top{align-items:flex-start;gap:10px}.home{font-size:13px}.filters{grid-template-columns:1fr}.filters .keyword{grid-column:auto}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">BSSBU · JOBKOREA DATA SEARCH</div><a class="home" href="/lectures/files/index.html">← 강의자료 라이브러리</a></header>
<section class="hero"><h1>잡코리아 채용공고</h1><p>공고명, 회사, 지역, 직무, 업무, 자격요건, 우대사항을 표로 한눈에 보고 자유롭게 필터링하세요.</p></section>
<section class="panel"><div class="filters"><input id="q" class="control keyword" type="search" placeholder="전체 필드 검색: 예) Python, LLM, 고객 문제 정의"><select id="field" class="control"><option value="">필드 선택</option></select><input id="fieldQuery" class="control" type="search" placeholder="선택한 필드에서 검색"><select id="region" class="control"><option value="">전체 지역</option></select><select id="career" class="control"><option value="">전체 경력</option></select><button id="reset" class="button" type="button">초기화</button></div>
<div class="summary"><div><strong id="count">불러오는 중…</strong> <span>개 공고</span></div><div id="updated"></div></div><div id="table" class="table-wrap"><div class="loading">CSV 데이터를 불러오는 중입니다.</div></div><nav id="pager" class="pager" aria-label="검색 결과 페이지"></nav><p class="source">데이터 파일: <a href="/lectures/files/jobkorea_fde_ontology_search_structured.csv">jobkorea_fde_ontology_search_structured.csv</a></p></section></main>
<script>
const CSV_URL='/lectures/files/jobkorea_fde_ontology_search_structured.csv',state={rows:[],headers:[],page:1,size:20};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quote){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const headers=rows.shift();return {headers,items:rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))} }
function values(key){return [...new Set(state.rows.map(r=>r[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}function fill(id,key,label){$(id).innerHTML=`<option value="">${label}</option>`+values(key).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function filtered(){const q=$('q').value.trim().toLowerCase(),fq=$('fieldQuery').value.trim().toLowerCase(),field=$('field').value,region=$('region').value,career=$('career').value;return state.rows.filter(r=>(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!fq||!field||String(r[field]??'').toLowerCase().includes(fq))&&(!region||r['지역']===region)&&(!career||r['경력']===career))}
function row(r){const url=esc(r['공고URL']);return `<tr><td class="rank">${esc(r['순위'])}</td><td class="title"><a href="${url}" target="_blank" rel="noopener">${esc(r['공고명'])}</a></td><td class="company">${esc(r['회사'])}</td><td><span class="badge">${esc(r['지역'])}</span></td><td>${esc(r['직무/업종'])}</td><td class="muted">${esc(r['경력'])}</td><td class="muted">${esc(r['등록일'])}</td><td class="muted">${esc(r['마감일'])}</td><td class="jobtext">${esc(r['주요업무'])}</td></tr>`}
function render(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,pages);const items=all.slice((state.page-1)*state.size,state.page*state.size);$('count').textContent=all.length.toLocaleString();$('table').innerHTML=items.length?`<table class="jobs"><thead><tr><th>#</th><th>공고명</th><th>회사</th><th>지역</th><th>직무/업종</th><th>경력</th><th>등록일</th><th>마감일</th><th>주요업무</th></tr></thead><tbody>${items.map(row).join('')}</tbody></table>`:'<div class="empty">조건에 맞는 공고가 없습니다.</div>';$('pager').innerHTML=pages<=1?'':Array.from({length:pages},(_,i)=>`<button class="page ${i+1===state.page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');document.querySelectorAll('.page').forEach(b=>b.onclick=()=>{state.page=+b.dataset.page;render();scrollTo({top:280,behavior:'smooth'})})}
['q','fieldQuery'].forEach(id=>$(id).addEventListener('input',()=>{state.page=1;render()}));['field','region','career'].forEach(id=>$(id).addEventListener('change',()=>{state.page=1;render()}));$('reset').onclick=()=>{['q','fieldQuery','field','region','career'].forEach(id=>$(id).value='');state.page=1;render()};
fetch(CSV_URL).then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{const parsed=parseCSV(t);state.headers=parsed.headers;state.rows=parsed.items;$('field').innerHTML='<option value="">필드 선택</option>'+state.headers.filter(h=>!['작성일','순위','등록일','마감일','공고URL','검색URL'].includes(h)).map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join('');fill('region','지역','전체 지역');fill('career','경력','전체 경력');$('updated').textContent=state.rows[0]?.작성일?'기준일 '+state.rows[0].작성일:'';render()}).catch(()=>{$('count').textContent='0';$('table').innerHTML='<div class="empty">CSV를 불러오지 못했습니다.</div>'});
</script></body></html>
