<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>잡코리아 채용공고 검색</title>
<style>
:root{--ink:#14213d;--muted:#68758a;--line:#dbe3ee;--bg:#f5f7fb;--card:#fff;--accent:#1769e0;--soft:#eaf2ff;--selected:#fff7e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Malgun Gothic",sans-serif;line-height:1.55}.wrap{max-width:1600px;margin:auto;padding:28px 22px 64px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-size:14px;font-weight:850;letter-spacing:.08em;color:var(--accent)}.home{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;font-weight:700}.hero{margin-bottom:22px}.hero h1{font-size:clamp(30px,4vw,50px);letter-spacing:-.055em;line-height:1.1;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #243b5b0a}.search-terms{padding:15px 17px;background:#f7faff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.search-terms h2{font-size:14px;margin:0 0 10px}.radio-list{display:flex;flex-wrap:wrap;gap:8px}.radio{position:relative}.radio input{position:absolute;opacity:0}.radio label{display:block;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;cursor:pointer;color:#42536d;font-size:13px}.radio input:checked+label{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}.filters{display:grid;grid-template-columns:minmax(260px,1.5fr) 180px 180px auto;gap:9px}.control{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}.control:focus{outline:3px solid #1769e024;border-color:var(--accent)}.button{border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;padding:0 16px;cursor:pointer}.summary{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0 11px;color:var(--muted);font-size:14px}.summary strong{color:var(--ink);font-size:18px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.jobs{border-collapse:collapse;width:100%;min-width:2100px;font-size:13px}.jobs th{position:sticky;top:0;background:#f1f5fa;color:#42536d;font-size:12px;text-align:left;white-space:nowrap;padding:11px 10px;border-bottom:1px solid var(--line)}.jobs td{vertical-align:top;padding:12px 10px;border-bottom:1px solid #e9eef5;max-width:250px;white-space:normal;word-break:keep-all;cursor:pointer}.jobs tbody tr:hover{background:#f8fbff}.jobs tbody tr.selected{background:var(--selected)}.jobs tbody tr:last-child td{border-bottom:0}.jobs a{color:var(--accent);font-weight:700}.jobs .url{word-break:break-all;min-width:220px}.empty,.loading{padding:45px;text-align:center;color:var(--muted)}.detail{display:none;margin-top:16px;border:2px solid var(--accent);border-radius:14px;background:#fff;padding:20px}.detail.open{display:block}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:15px}.detail h2{font-size:22px;line-height:1.35;margin:0}.detail-close{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}.detail-item{padding:12px 14px;border-bottom:1px solid var(--line)}.detail-item:nth-child(odd){border-right:1px solid var(--line)}.detail-item dt{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:3px}.detail-item dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.pager{display:flex;justify-content:center;gap:6px;margin-top:18px}.page{min-width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.page.active{background:var(--ink);border-color:var(--ink);color:#fff}.source{font-size:12px;color:var(--muted);margin:18px 0 0}.source a{color:var(--accent)}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .keyword{grid-column:1/-1}.filters .button{min-height:44px}.detail-grid{grid-template-columns:1fr}.detail-item:nth-child(odd){border-right:0}}@media(max-width:560px){.wrap{padding:20px 13px 50px}.top{align-items:flex-start;gap:10px}.home{font-size:13px}.filters{grid-template-columns:1fr}.filters .keyword{grid-column:auto}.radio-list{display:grid;grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">BSSBU · JOBKOREA DATA SEARCH</div><a class="home" href="/lectures/files/index.html">← 강의자료 라이브러리</a></header>
<section class="hero"><h1>잡코리아 채용공고</h1><p>CSV의 모든 필드를 표로 확인하고, 검색어를 선택해 원하는 공고를 빠르게 찾으세요. 행을 클릭하면 전체 상세정보가 나타납니다.</p></section>
<section class="panel">
<div class="search-terms"><h2>검색어</h2><div id="terms" class="radio-list"><span class="loading">검색어를 불러오는 중입니다.</span></div></div>
<div class="filters"><input id="q" class="control keyword" type="search" placeholder="전체 필드에서 검색"><select id="region" class="control"><option value="">전체 지역</option></select><select id="career" class="control"><option value="">전체 경력</option></select><button id="reset" class="button" type="button">초기화</button></div>
<div class="summary"><div><strong id="count">불러오는 중…</strong> <span>개 공고</span></div><div id="updated"></div></div>
<div id="table" class="table-wrap"><div class="loading">CSV 데이터를 불러오는 중입니다.</div></div><nav id="pager" class="pager" aria-label="검색 결과 페이지"></nav>
<section id="detail" class="detail" aria-live="polite"></section>
<p class="source">데이터 파일: <a href="/lectures/files/jobkorea_fde_ontology_search_structured.csv">jobkorea_fde_ontology_search_structured.csv</a></p>
</section></main>
<script>
const CSV_URL='/lectures/files/jobkorea_fde_ontology_search_structured.csv',state={rows:[],headers:[],page:1,size:20,selected:null,term:''};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quote){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const headers=rows.shift();return{headers,items:rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))} }
function values(key){return[...new Set(state.rows.map(r=>r[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}function fill(id,key,label){$(id).innerHTML=`<option value="">${label}</option>`+values(key).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function filtered(){const q=$('q').value.trim().toLowerCase(),region=$('region').value,career=$('career').value;return state.rows.filter(r=>(!state.term||r['검색어']===state.term)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!region||r['지역']===region)&&(!career||r['경력']===career))}
function urlCell(header,value){if(!value)return'';if(header==='공고URL'||header==='검색URL'){return`<a class="url" href="${esc(value)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(value)}</a>`}return esc(value)}
function showDetail(index){state.selected=index;const r=state.rows[index];$('detail').innerHTML=`<div class="detail-head"><h2>${esc(r['공고명']||'채용공고 상세정보')}</h2><button class="detail-close" type="button" onclick="closeDetail()">닫기</button></div><dl class="detail-grid">${state.headers.map(h=>`<div class="detail-item"><dt>${esc(h)}</dt><dd>${urlCell(h,r[h])||'—'}</dd></div>`).join('')}</dl>`;$('detail').classList.add('open');document.querySelectorAll('.jobs tbody tr').forEach(tr=>tr.classList.toggle('selected',Number(tr.dataset.index)===index));$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeDetail(){state.selected=null;$('detail').classList.remove('open');document.querySelectorAll('.jobs tbody tr').forEach(tr=>tr.classList.remove('selected'))}
function row(r,index){return`<tr data-index="${index}" onclick="showDetail(${index})">${state.headers.map(h=>`<td>${urlCell(h,r[h])||'—'}</td>`).join('')}</tr>`}
function render(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,pages);const items=all.slice((state.page-1)*state.size,state.page*state.size);$('count').textContent=all.length.toLocaleString();$('table').innerHTML=items.length?`<table class="jobs"><thead><tr>${state.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${items.map(r=>row(r,state.rows.indexOf(r))).join('')}</tbody></table>`:'<div class="empty">조건에 맞는 공고가 없습니다.</div>';$('pager').innerHTML=pages<=1?'':Array.from({length:pages},(_,i)=>`<button class="page ${i+1===state.page?'active':''}" data-page="${i+1}">${i+1}</button>`).join('');document.querySelectorAll('.page').forEach(b=>b.onclick=()=>{state.page=+b.dataset.page;render();scrollTo({top:280,behavior:'smooth'})});if(state.selected!==null&&!all.includes(state.rows[state.selected]))closeDetail()}
function renderTerms(){const terms=['',...values('검색어')];$('terms').innerHTML=terms.map((v,i)=>{const id=`term-${i}`;return`<span class="radio"><input id="${id}" type="radio" name="searchTerm" value="${esc(v)}" ${state.term===v?'checked':''}><label for="${id}">${v?esc(v):'전체 검색어'}</label></span>`}).join('');document.querySelectorAll('input[name="searchTerm"]').forEach(input=>input.onchange=()=>{state.term=input.value;state.page=1;render()})}
$('q').addEventListener('input',()=>{state.page=1;render()});['region','career'].forEach(id=>$(id).addEventListener('change',()=>{state.page=1;render()}));$('reset').onclick=()=>{$('q').value='';$('region').value='';$('career').value='';state.term='';state.page=1;renderTerms();render()};
fetch(CSV_URL).then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{const parsed=parseCSV(t);state.headers=parsed.headers;state.rows=parsed.items;renderTerms();fill('region','지역','전체 지역');fill('career','경력','전체 경력');$('updated').textContent=state.rows[0]?.작성일?'기준일 '+state.rows[0].작성일:'';render()}).catch(()=>{$('count').textContent='0';$('terms').innerHTML='<span class="empty">CSV를 불러오지 못했습니다.</span>';$('table').innerHTML='<div class="empty">CSV를 불러오지 못했습니다.</div>'});
</script></body></html>
