</style></head><body><header><div><small>부성순 · LangChain 학습 교안</small><h1>langchain.agents.middleware</h1><div class="tag">기초 → 실습 → 이해도 확인</div></div><span id="headcount">01 / 20</span></header><div class="shell"><main class="main"><section class="panel"><div class="kicker" id="number"></div><h2 id="title"></h2><div class="desc" id="objective"></div><h3>핵심 설명</h3><p id="explain"></p><h3>Python 실습</h3><div class="codehead"><small>실행 환경: Python 3.10+ · LangChain 1.x</small><button class="copy" id="copy">코드 복사</button></div><pre><code id="code"></code></pre><div class="hint" id="note"></div></section><section class="panel quiz"><div class="kicker">이해도 확인</div><h3 id="question"></h3><div id="options"></div><button class="btn primary" id="check">정답 확인</button><div class="feedback" id="feedback" aria-live="polite"></div><div class="nav"><button class="btn" id="prev">← 이전 단계</button><button class="btn primary" id="next">다음 단계 →</button></div></section><div class="foot refs">공식 문서: <a target="_blank" rel="noopener" href="https://docs.langchain.com/oss/python/langchain/middleware/overview">개요</a> · <a target="_blank" rel="noopener" href="https://docs.langchain.com/oss/python/langchain/middleware/custom">커스텀 훅</a> · <a target="_blank" rel="noopener" href="https://reference.langchain.com/python/langchain/agents/middleware">API 레퍼런스</a><br>본 교안은 실행 코드를 브라우저에서 직접 실행하는 환경이 아닙니다. Python 파일/터미널에 복사해 실행하세요. 각 단계의 코드가 이전 단계의 함수 정의를 전제로 할 때는 주석을 확인하세요.</div></main><aside class="steps"><h3>학습 단계 <small id="progressText"></small></h3><div class="progress"><div class="bar" id="bar"></div></div><div id="tabs"></div><button class="btn" id="reset" style="width:100%;margin-top:12px">학습 기록 초기화</button></aside></div><script>
const lessons=[{"title": "모듈과 역할", "objective": "에이전트 미들웨어는 실행 흐름 중간에 관찰·개입하는 기능입니다.", "code": "from langchain.agents import create_agent\nfrom langchain.agents.middleware import before_model, after_model\n\n# middleware는 create_agent(..., middleware=[...])에 전달합니다.", "explain": "미들웨어는 모델 호출 전후 기록, 재시도, 개인정보 보호, 사람 승인 등을 담당합니다. LangGraph 기반 에이전트 내부의 실행 훅입니다.", "question": "미들웨어의 주목적은?", "options": ["에이전트 동작에 중간 개입", "Python 버전 변경", "벡터DB 자체 생성"], "correct": 0, "feedback": "", "note": ""}, {"title": "설치 및 첫 에이전트", "objective": "LangChain 1.x와 OpenAI 연동 패키지를 설치합니다.", "code": "# 터미널\n# pip install -U langchain langchain-openai\n\nfrom langchain.agents import create_agent\n\nagent = create_agent(model=\"openai:gpt-4.1-mini\", tools=[])\n# 실행 시 OPENAI_API_KEY 필요", "explain": "모델 지정과 도구 등록은 에이전트 기본 설정이며, 이어서 middleware 매개변수에 훅을 추가합니다. 모델명은 예시이고 계정에서 사용 가능한 모델로 교체할 수 있습니다.", "question": "middleware를 전달하는 위치는?", "options": ["graph.add_node()", "create_agent(middleware=[...])", "AIMessage(content=...)"], "correct": 1, "feedback": "", "note": ""}, {"title": "before_model 훅", "objective": "모델 호출 직전에 실행되는 훅입니다.", "code": "from langchain.agents.middleware import before_model, AgentState\nfrom langgraph.runtime import Runtime\n\n@before_model\ndef log_input(state: AgentState, runtime: Runtime):\n    print(\"모델 호출 직전:\", len(state[\"messages\"]))\n    return None", "explain": "반환값 None은 변경할 상태가 없다는 뜻입니다. 도구 사용으로 모델이 여러 번 호출되면 이 훅도 여러 번 실행될 수 있습니다.", "question": "before_model은 언제 실행될까요?", "options": ["에이전트 생성 전", "매 모델 호출 직전", "도구 실행 완료 직후"], "correct": 1, "feedback": "", "note": ""}, {"title": "after_model 훅", "objective": "모델의 응답을 받은 직후 실행되는 훅입니다.", "code": "from langchain.agents.middleware import after_model, AgentState\nfrom langgraph.runtime import Runtime\n\n@after_model\ndef log_output(state: AgentState, runtime: Runtime):\n    print(\"모델 응답:\", state[\"messages\"][-1].content)\n    return None", "explain": "모델이 도구 호출을 선택할 때도 응답이 AIMessage로 추가됩니다. 이 시점이 에이전트 전체 종료 시점은 아닐 수 있습니다.", "question": "after_model은 무엇을 의미하나요?", "options": ["최종 대화 종료만", "각 모델 응답 직후", "툴 실행 이전에만"], "correct": 1, "feedback": "", "note": ""}, {"title": "훅을 create_agent에 연결", "objective": "앞서 선언한 미들웨어 객체를 리스트로 전달합니다.", "code": "from langchain.agents import create_agent\n\n# STEP 03~04의 log_input, log_output 선언 이후\nagent = create_agent(\n    model=\"openai:gpt-4.1-mini\",\n    tools=[],\n    middleware=[log_input, log_output]\n)\n\nresult = agent.invoke({\"messages\": [{\"role\":\"user\", \"content\":\"안녕\"}]})\nprint(result[\"messages\"][-1].content)", "explain": "이 단계부터는 실제 모델 호출 비용과 API 키가 필요합니다. 훅은 선언만으로 동작하지 않고 에이전트에 전달해야 합니다.", "question": "log_input을 실행시키려면?", "options": ["middleware 리스트에 등록", "반드시 tools에 등록", "StateGraph( ) 삭제"], "correct": 0, "feedback": "", "note": ""}, {"title": "before_agent / after_agent", "objective": "에이전트 호출 전체의 시작과 끝에 실행하는 훅입니다.", "code": "from langchain.agents.middleware import before_agent, after_agent, AgentState\nfrom langgraph.runtime import Runtime\n\n@before_agent\ndef on_start(state: AgentState, runtime: Runtime):\n    print(\"에이전트 시작\")\n    return None\n\n@after_agent\ndef on_finish(state: AgentState, runtime: Runtime):\n    print(\"에이전트 종료\")\n    return None", "explain": "before_agent와 after_agent는 각각 에이전트 호출 단위로 실행됩니다. 모델-도구 루프의 각 호출마다 실행되는 before_model과 다릅니다.", "question": "모델이 3회 호출되는 한 번의 에이전트 실행에서 before_agent는 보통 몇 번?", "options": ["1번", "3번", "0번"], "correct": 0, "feedback": "", "note": ""}, {"title": "wrap_model_call 기본", "objective": "모델 호출 자체를 둘러싸고 실행 전후를 제어합니다.", "code": "from langchain.agents.middleware import wrap_model_call, ModelRequest, ModelResponse\nfrom typing import Callable\n\n@wrap_model_call\ndef around_model(request: ModelRequest,\n                 handler: Callable[[ModelRequest], ModelResponse]) -> ModelResponse:\n    print(\"모델 호출 전\")\n    response = handler(request)\n    print(\"모델 호출 후\")\n    return response", "explain": "handler(request)가 실제 다음 미들웨어/모델 호출로 이어지는 핵심입니다. 로그·예외 처리·재시도 등을 구현할 수 있습니다.", "question": "실제 모델 호출을 진행시키는 표현은?", "options": ["return None", "handler(request)", "request.invoke()"], "correct": 1, "feedback": "", "note": ""}, {"title": "wrap_model_call 재시도", "objective": "실패한 모델 호출을 제한된 횟수만큼 다시 시도합니다.", "code": "from langchain.agents.middleware import wrap_model_call\n\n@wrap_model_call\ndef retry_once(request, handler):\n    try:\n        return handler(request)\n    except TimeoutError:\n        print(\"일시적 타임아웃: 한 번 더 시도\")\n        return handler(request)", "explain": "예제는 TimeoutError만 재시도하며, 실제 SDK에서 발생하는 오류 종류는 모델 공급자에 따라 다릅니다. 운영에서는 ModelRetryMiddleware 사용을 권장합니다.", "question": "재시도를 하려면 무엇을 반복 호출하나요?", "options": ["handler(request)", "create_agent()", "graph.compile()"], "correct": 0, "feedback": "", "note": ""}, {"title": "dynamic_prompt", "objective": "호출 때마다 시스템 프롬프트를 동적으로 바꿉니다.", "code": "from langchain.agents.middleware import dynamic_prompt, ModelRequest\n\n@dynamic_prompt\ndef shop_prompt(request: ModelRequest) -> str:\n    return \"당신은 쇼핑몰 FAQ 상담원입니다. 근거가 없으면 모른다고 답하세요.\"\n\n# agent = create_agent(model=\"openai:gpt-4.1-mini\",\n#                      tools=[], middleware=[shop_prompt])", "explain": "@dynamic_prompt의 함수는 문자열을 반환합니다. 사용자 등급·업무 유형 등 실행 컨텍스트에 따라 프롬프트를 바꿀 수도 있습니다.", "question": "dynamic_prompt의 반환값은?", "options": ["int", "시스템 프롬프트 문자열", "DB 연결"], "correct": 1, "feedback": "", "note": ""}, {"title": "wrap_tool_call", "objective": "도구 실행 앞뒤에서 로그·오류 처리를 합니다.", "code": "from langchain.agents.middleware import wrap_tool_call\n\n@wrap_tool_call\ndef audit_tool(request, handler):\n    print(\"도구:\", request.tool_call[\"name\"])\n    return handler(request)", "explain": "request.tool_call은 도구 호출 정보입니다. 이 함수는 @tool 함수 자체가 아니라 에이전트의 도구 실행 경로를 감쌉니다.", "question": "도구 호출 전후 개입에 쓰는 훅은?", "options": ["wrap_tool_call", "before_agent", "dynamic_prompt"], "correct": 0, "feedback": "", "note": ""}, {"title": "AgentMiddleware 클래스", "objective": "여러 훅을 하나의 재사용 가능한 클래스로 묶습니다.", "code": "from langchain.agents.middleware import AgentMiddleware, AgentState\nfrom langgraph.runtime import Runtime\n\nclass LoggingMiddleware(AgentMiddleware):\n    def before_model(self, state: AgentState, runtime: Runtime):\n        print(\"모델 입력 메시지 수:\", len(state[\"messages\"]))\n        return None\n\n    def after_model(self, state: AgentState, runtime: Runtime):\n        print(\"모델 응답 확인\")\n        return None\n\n# middleware=[LoggingMiddleware()]", "explain": "간단한 1개 훅에는 데코레이터, 여러 훅·설정에는 클래스가 적합합니다.", "question": "클래스로 정의한 미들웨어를 전달할 때는?", "options": ["LoggingMiddleware()", "LoggingMiddleware.before_model", "\"LoggingMiddleware\" 문자열"], "correct": 0, "feedback": "", "note": ""}, {"title": "상태 업데이트", "objective": "노드형 훅은 dict를 반환해 State를 업데이트할 수 있습니다.", "code": "from typing_extensions import NotRequired\nfrom langchain.agents.middleware import AgentState, before_model\nfrom langgraph.runtime import Runtime\n\nclass ShopState(AgentState):\n    checked: NotRequired[bool]\n\n@before_model(state_schema=ShopState)\ndef mark_checked(state: ShopState, runtime: Runtime):\n    return {\"checked\": True}", "explain": "messages뿐 아니라 추가로 정의한 State 필드도 관리할 수 있습니다. 아직 정의하지 않은 상태 키를 무작정 반환하지 마세요.", "question": "State 변경을 위해 노드형 훅이 반환하는 값은?", "options": ["딕셔너리", "SQL 쿼리", "모델 이름"], "correct": 0, "feedback": "", "note": ""}, {"title": "모델 호출 횟수 제한", "objective": "내장 ModelCallLimitMiddleware로 과도한 모델 호출을 방지합니다.", "code": "from langchain.agents.middleware import ModelCallLimitMiddleware\n\nlimit = ModelCallLimitMiddleware(\n    run_limit=3,\n    exit_behavior=\"end\"\n)\n\n# create_agent(..., middleware=[limit])", "explain": "run_limit는 한 번의 에이전트 실행 동안 모델 호출 횟수 제한입니다. 종료 정책에 따라 동작이 달라집니다.", "question": "run_limit=3의 뜻은?", "options": ["툴 3개 등록", "한 실행의 모델 호출 상한 3회", "대화 메시지 총 3개"], "correct": 1, "feedback": "", "note": ""}, {"title": "도구 호출 횟수 제한", "objective": "특정 도구 또는 전체 도구 호출 횟수를 제한합니다.", "code": "from langchain.agents.middleware import ToolCallLimitMiddleware\n\nlimit = ToolCallLimitMiddleware(\n    tool_name=\"search_faq\",\n    run_limit=2,\n    exit_behavior=\"continue\"\n)\n\n# create_agent(..., middleware=[limit])", "explain": "exit_behavior=\"continue\"에서는 제한 초과 도구를 차단하면서 에이전트는 계속 진행할 수 있습니다.", "question": "tool_name 파라미터는?", "options": ["대상 도구 이름 지정", "LLM 모델 이름 지정", "최종 출력 키 이름"], "correct": 0, "feedback": "", "note": ""}, {"title": "모델 재시도 · 대체", "objective": "실패 시 모델 호출을 재시도하거나 예비 모델로 전환합니다.", "code": "from langchain.agents.middleware import ModelRetryMiddleware, ModelFallbackMiddleware\n\nretry = ModelRetryMiddleware(max_retries=2)\nfallback = ModelFallbackMiddleware(\"openai:gpt-4.1-mini\")\n\n# 기본 모델과 예비 모델은 다르게 구성하는 것이 좋습니다.\n# create_agent(model=\"openai:gpt-4.1\", tools=[],\n#              middleware=[retry, fallback])", "explain": "ModelRetryMiddleware는 일시적 실패에 재시도, ModelFallbackMiddleware는 대체 모델로 우회합니다. 모델명·접근 권한을 확인하세요.", "question": "대체 모델로 전환하는 것은?", "options": ["ModelFallbackMiddleware", "PIIMiddleware", "ToolCallLimitMiddleware"], "correct": 0, "feedback": "", "note": ""}, {"title": "민감정보 보호", "objective": "PIIMiddleware는 메시지의 개인정보를 탐지하고 대응합니다.", "code": "from langchain.agents.middleware import PIIMiddleware\n\npii = PIIMiddleware(\n    \"email\",\n    strategy=\"redact\",\n    apply_to_input=True\n)\n\n# create_agent(..., middleware=[pii])", "explain": "redact는 탐지된 이메일을 가립니다. 패턴 기반 탐지이므로 모든 민감정보를 완벽히 발견한다고 가정하면 안 됩니다.", "question": "strategy=\"redact\"의 뜻은?", "options": ["탐지된 값을 가림", "이메일 발송", "모델 변경"], "correct": 0, "feedback": "", "note": ""}, {"title": "사람 승인: HumanInTheLoop", "objective": "민감한 도구 실행 전에 사람의 승인 단계를 둡니다.", "code": "from langchain.agents.middleware import HumanInTheLoopMiddleware\nfrom langgraph.checkpoint.memory import InMemorySaver\n\nhitl = HumanInTheLoopMiddleware(\n    interrupt_on={\"refund_payment\": True}\n)\n\n# agent = create_agent(model=\"openai:gpt-4.1-mini\",\n#     tools=[refund_payment], middleware=[hitl],\n#     checkpointer=InMemorySaver())", "explain": "실행 재개에는 이전 단계에서 배운 thread_id와 Command(resume=...)가 필요합니다. 이 코드는 설정 조각이며 refund_payment 도구가 추가로 정의되어야 합니다.", "question": "HITL 미들웨어의 용도는?", "options": ["모델의 지식 증강", "민감한 도구 실행 전 승인", "검색 인덱스 생성"], "correct": 1, "feedback": "", "note": ""}, {"title": "미들웨어 실행 순서", "objective": "여러 미들웨어는 훅 종류에 따라 순서가 달라집니다.", "code": "# middleware=[A, B, C]\n# before_model : A -> B -> C\n# wrap_model_call : A( B( C( model ) ) )\n# after_model : C -> B -> A", "explain": "before_*는 등록 순서, after_*는 역순, wrap_*는 바깥쪽부터 감싸는 중첩 구조입니다.", "question": "A,B,C의 after_model 순서는?", "options": ["A,B,C", "C,B,A", "무작위"], "correct": 1, "feedback": "", "note": ""}, {"title": "오류와 주의사항", "objective": "미들웨어는 모델 호출 경로 일부이므로 과한 작업에 주의합니다.", "code": "# 나쁜 예: 모든 예외를 무조건 삼킴\n# @wrap_model_call\n# def unsafe(request, handler):\n#     try:\n#         return handler(request)\n#     except Exception:\n#         return None  # 호출 계약을 깨뜨릴 수 있음\n\n# 좋은 원칙: 필요한 예외만 처리하고 나머지는 전파", "explain": "비용, 지연, 개인정보 로그, 멱등성, 중복 실행을 점검하세요. LangGraph interrupt 제어 흐름을 임의로 삼키면 안 됩니다.", "question": "예외 처리 원칙으로 적절한 것은?", "options": ["모든 예외를 무조건 무시", "필요한 예외만 선택적으로 처리", "반환값은 아무 값이나 허용"], "correct": 1, "feedback": "", "note": ""}, {"title": "종합 실습: 쇼핑몰 상담", "objective": "모델 호출 로깅과 호출 제한을 결합해 봅니다.", "code": "import os\nfrom langchain.agents import create_agent\nfrom langchain.agents.middleware import (\n    before_model, after_model, AgentState, ModelCallLimitMiddleware\n)\nfrom langgraph.runtime import Runtime\n\n@before_model\ndef audit_input(state: AgentState, runtime: Runtime):\n    print(\"[입력] 메시지 수:\", len(state[\"messages\"]))\n    return None\n\n@after_model\ndef audit_output(state: AgentState, runtime: Runtime):\n    print(\"[출력] 모델 응답 수신\")\n    return None\n\nagent = create_agent(\n    model=\"openai:gpt-4.1-mini\",\n    tools=[],\n    system_prompt=\"쇼핑몰 FAQ 상담원입니다. 모르면 모른다고 답하세요.\",\n    middleware=[audit_input, audit_output,\n                ModelCallLimitMiddleware(run_limit=3)]\n)\n\n# OPENAI_API_KEY 환경변수 설정 후 실행\nresult = agent.invoke({\"messages\": [{\"role\": \"user\",\n                                     \"content\": \"배송기간은 며칠인가요?\"}]})\nprint(result[\"messages\"][-1].content)", "explain": "이 예제에는 검색 도구가 없으므로 실제 배송 규정의 근거를 제공할 수 없습니다. FAQ RAG에서는 검색 도구를 추가하고 tool 호출에도 감사 훅을 붙여 확장할 수 있습니다.", "question": "이 종합 예제에서 실제 배송 규정을 검색하려면?", "options": ["검색 도구 추가", "모델 호출 제한 삭제만", "docstring만 변경"], "correct": 0, "feedback": "", "note": ""}];const key='middleware-lessons-v1';let passed=new Set();try{passed=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch(e){}let selected=0;function $(s){return document.getElementById(s)}function save(){try{localStorage.setItem(key,JSON.stringify([...passed]))}catch(e){}}function render(){let l=lessons[selected];$('number').textContent=String(selected+1).padStart(2,'0')+' / '+lessons.length;$('headcount').textContent=String(selected+1).padStart(2,'0')+' / '+lessons.length;$('title').textContent=l.title;$('objective').textContent=l.objective;$('explain').textContent=l.explain;$('code').textContent=l.code;$('note').textContent=l.note||'핵심: '+l.objective;$('question').textContent=l.question;$('feedback').textContent=passed.has(selected)?'✓ 이 단계는 통과했습니다.':'';$('feedback').className='feedback '+(passed.has(selected)?'good':'');$('options').innerHTML='';l.options.forEach((opt,i)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='answer';input.value=i;label.appendChild(input);label.appendChild(document.createTextNode(String(i+1)+'번. '+opt));$('options').appendChild(label)});$('next').disabled=!passed.has(selected)||selected===lessons.length-1;$('prev').disabled=selected===0;$('tabs').innerHTML='';lessons.forEach((v,i)=>{const b=document.createElement('button');b.className='tab'+(i===selected?' current':'')+(i>0&&!passed.has(i-1)?' locked':'');b.disabled=i>0&&!passed.has(i-1);b.textContent=(passed.has(i)?'✓ ':'')+String(i+1).padStart(2,'0')+' '+v.title;b.onclick=()=>{selected=i;render();scrollTo({top:0,behavior:'smooth'})};$('tabs').appendChild(b)});$('progressText').textContent=`${passed.size}/${lessons.length} 완료`;$('bar').style.width=(passed.size/lessons.length*100)+'%'}$('check').onclick=()=>{let input=document.querySelector('input[name=answer]:checked');if(!input){$('feedback').textContent='답을 먼저 선택하세요.';$('feedback').className='feedback bad';return}if(Number(input.value)===lessons[selected].correct){passed.add(selected);save();render();$('feedback').textContent='✓ 정답입니다! '+(lessons[selected].feedback||'다음 단계로 진행할 수 있습니다.');$('feedback').className='feedback good'}else{$('feedback').textContent='다시 생각해 보세요. 핵심 설명과 코드를 확인해 보세요.';$('feedback').className='feedback bad'}};$('next').onclick=()=>{if(passed.has(selected)&&selected<lessons.length-1){selected++;render();scrollTo({top:0,behavior:'smooth'})}};$('prev').onclick=()=>{if(selected>0){selected--;render();scrollTo({top:0,behavior:'smooth'})}};$('copy').onclick=async()=>{const text=lessons[selected].code;try{await navigator.clipboard.writeText(text);$('copy').textContent='복사됨 ✓'}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('copy').textContent='복사됨 ✓'}setTimeout(()=>$('copy').textContent='코드 복사',1300)};$('reset').onclick=()=>{if(confirm('학습 진행 기록을 초기화할까요?')){passed.clear();save();selected=0;render()}};render();
