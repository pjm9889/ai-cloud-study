<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenericFakeChatModel 단계별 학습 · 부성순</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f7f8fb;color:#202638}header{background:#17223b;color:white;padding:22px max(24px,calc((100vw - 1160px)/2))}header small{color:#b7c5dd}header h1{margin:7px 0;font-size:25px}main{max-width:1160px;margin:26px auto;padding:0 22px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:22px}.side,.panel{background:white;border:1px solid #e1e6ef;border-radius:15px}.side{padding:14px;height:max-content}.tab{border:0;background:transparent;width:100%;padding:12px;text-align:left;font-size:14px;border-radius:9px;cursor:pointer;color:#3d4960}.tab.active{background:#fde6ec;color:#ac2454;font-weight:700}.tab.locked{opacity:.45}.tag{font-size:12px;color:#8b4261}.panel{padding:30px 34px;min-height:610px}.top{display:flex;align-items:center;justify-content:space-between}.num{font-size:14px;color:#c52f68;font-weight:800}.panel h2{font-size:25px;margin:13px 0}.desc{line-height:1.85;color:#414c60}h3{font-size:17px;margin:27px 0 11px}.codebox{position:relative;background:#131e32;color:#e4eaf4;border-radius:12px;overflow:hidden}.codebox pre{overflow:auto;padding:22px 18px;font-family:Consolas,monospace;font-size:13px;line-height:1.65;white-space:pre}.copy{position:absolute;right:10px;top:9px;background:#34435c;color:white;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}.output{background:#f3f6fa;border-radius:9px;padding:14px;white-space:pre-wrap;font:13px Consolas,monospace;color:#324057}.quiz{border:1px solid #f0c9d6;background:#fff9fb;padding:20px;border-radius:12px;margin-top:26px}.quiz strong{display:block;margin-bottom:13px}.option{display:block;padding:11px 8px;border-bottom:1px solid #f1e3e7;cursor:pointer}.btn{background:#c52f68;color:white;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;margin-top:15px}.btn.alt{background:#edf0f5;color:#34435c}.feedback{margin-top:12px;font-weight:600;line-height:1.6}.foot{display:flex;justify-content:space-between;margin-top:24px;gap:10px}.progress{height:7px;background:#e8ebf0;border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#d84779;transition:.2s}.sources{font-size:12px;color:#607086;line-height:1.7;margin-top:25px}.sources a{color:#ae315e}@media(max-width:800px){main{display:block}.side{display:flex;overflow:auto;gap:6px;margin-bottom:16px}.tab{min-width:130px}.panel{padding:22px 18px}header{padding:20px}}</style></head><body><header><small>부성순 · LangChain 실습 교안</small><h1>GenericFakeChatModel · Step by Step</h1><small>한 단계 학습 → 이해도 확인 → 다음 단계 / OpenAI API 키 불필요</small></header><main><aside class="side"><div style="width:100%"><b>학습 단계</b><div class="progress"><div id="bar"></div></div><small id="stats"></small><div id="tabs"></div></div></aside><article class="panel"><div id="content"></div><div class="sources">공식 참고: <a href="https://reference.langchain.com/python/langchain-core/language_models/fake_chat_models/GenericFakeChatModel" target="_blank" rel="noopener">GenericFakeChatModel API</a> · <a href="https://github.com/langchain-ai/langchain/blob/master/openwiki/unit-tests.md" target="_blank" rel="noopener">Fake 모델 테스트 가이드</a><p>참고: 실제 LLM 응답 품질이나 도구 선택 정확도를 검증하는 모델은 아닙니다. 응답은 사전에 지정한 순서로 반환됩니다.</p></div></article></main><script>const DATA=[{"num": "01", "title": "개념과 import", "desc": "GenericFakeChatModel은 실제 LLM API를 호출하지 않고 미리 준비한 응답을 반환하는 테스트용 채팅 모델입니다. OpenAI API 키·비용 없이 LangChain 호출 흐름을 연습할 수 있습니다.", "code": "from langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\n# 아직 실행하지 않고 클래스를 가져오기만 합니다.\nprint(GenericFakeChatModel.__name__)", "output": "GenericFakeChatModel", "q": "이 모델의 주요 목적은?", "choices": ["실제 검색엔진에 질의하기", "미리 정해둔 응답으로 채팅 모델 동작 시험하기", "모델 가중치 학습하기"], "correct": 1, "why": "모의 모델이므로 실제 질문을 이해해 답을 생성하는 모델은 아닙니다."}, {"num": "02", "title": "설치와 객체 생성", "desc": "messages에 응답의 반복자(iterator)를 넘깁니다. 리스트를 그대로 넘기지 말고 iter([...])로 감싸는 점이 핵심입니다.", "code": "# 터미널: pip install -U langchain-core\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(\n    messages=iter([\"안녕하세요!\", \"반갑습니다!\"])\n)\nprint(type(model).__name__)", "output": "GenericFakeChatModel", "q": "messages=에 가장 적절한 값은?", "choices": ["[\"A\", \"B\"]", "iter([\"A\", \"B\"])", "{\"A\": \"B\"}"], "correct": 1, "why": "messages는 Iterator[AIMessage | str] 타입을 사용합니다."}, {"num": "03", "title": "invoke() 첫 실행", "desc": "invoke()를 호출하면 미리 준비한 응답 하나를 소비해 AIMessage 형태로 돌려줍니다. 입력 질문 내용에 따라 추론해서 답을 만드는 기능은 없습니다.", "code": "from langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(messages=iter([\"배송은 2일입니다.\"]))\nresponse = model.invoke(\"배송은 얼마나 걸리나요?\")\nprint(type(response).__name__)  # AIMessage\nprint(response.content)         # 배송은 2일입니다.", "output": "배송은 2일입니다.", "q": "invoke() 반환값의 대표적인 타입은?", "choices": ["AIMessage", "HumanMessage", "ToolMessage"], "correct": 0, "why": "채팅 모델 인터페이스의 응답은 AIMessage입니다."}, {"num": "04", "title": "HumanMessage 입력", "desc": "문자열 대신 메시지 리스트도 넣을 수 있습니다. SystemMessage, HumanMessage 등을 사용하면 이후 실제 ChatModel로 교체하기 쉽습니다.", "code": "from langchain_core.messages import HumanMessage, SystemMessage\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(messages=iter([\"모의 답변입니다.\"]))\nresponse = model.invoke([\n    SystemMessage(content=\"간결하게 답해.\"),\n    HumanMessage(content=\"환불 규정 알려줘\")\n])\nprint(response.content)", "output": "모의 답변입니다.", "q": "SystemMessage가 입력에 있어도 Fake 모델은?", "choices": ["정해진 응답을 반환한다", "자동으로 한국어 번역한다", "임베딩을 생성한다"], "correct": 0, "why": "이 모델은 프롬프트 의미를 분석해서 응답을 생성하지 않습니다."}, {"num": "05", "title": "AIMessage도 응답으로 사용", "desc": "문자열뿐 아니라 AIMessage 객체를 미리 준비할 수 있습니다. 테스트에서 응답 객체의 구조를 직접 지정할 때 편리합니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(messages=iter([\n    AIMessage(content=\"승인되었습니다.\")\n]))\nanswer = model.invoke(\"환불 승인해줘\")\nprint(answer.content)", "output": "승인되었습니다.", "q": "messages에 준비할 수 있는 값은?", "choices": ["정수만", "AIMessage 또는 문자열", "HumanMessage만"], "correct": 1, "why": "공식 타입은 AIMessage | str 반복자입니다."}, {"num": "06", "title": "여러 번 호출과 소진", "desc": "여러 응답을 넣으면 invoke() 할 때마다 다음 응답을 가져옵니다. 한 번만 쓸 반복자는 소진될 수 있으니 호출 횟수에 유의하세요.", "code": "from langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(messages=iter([\"첫 답변\", \"둘째 답변\"]))\nprint(model.invoke(\"질문1\").content)\nprint(model.invoke(\"질문2\").content)\n# 위 반복자는 이제 모두 소비되었습니다. 추가 호출은 피하세요.", "output": "첫 답변\n둘째 답변", "q": "응답 2개가 담긴 iter([...])에 invoke()를 2회 호출하면?", "choices": ["둘 다 첫 답변", "첫 답변 후 둘째 답변", "항상 오류"], "correct": 1, "why": "반복자는 요소를 하나씩 소비합니다."}, {"num": "07", "title": "cycle로 응답 반복", "desc": "테스트 실행 횟수가 정해져 있지 않다면 itertools.cycle()을 사용해 응답을 반복할 수 있습니다. 무한 반복자이므로 종료 조건 없는 소비에는 주의합니다.", "code": "from itertools import cycle\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(messages=cycle([\"예\", \"아니오\"]))\nfor question in [\"Q1\", \"Q2\", \"Q3\", \"Q4\"]:\n    print(question, model.invoke(question).content)\n# Q1 예 / Q2 아니오 / Q3 예 / Q4 아니오", "output": "Q1 예\nQ2 아니오\nQ3 예\nQ4 아니오", "q": "cycle([\"예\", \"아니오\"])의 세 번째 응답은?", "choices": ["예", "아니오", "없음"], "correct": 0, "why": "cycle은 순서대로 반복합니다."}, {"num": "08", "title": "stream() 기초", "desc": "GenericFakeChatModel은 테스트용 스트리밍 인터페이스도 제공합니다. stream()은 조각 단위의 AIMessageChunk를 순회합니다. 조각의 분할 방식은 구현 버전에 따라 달라질 수 있습니다.", "code": "from langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nmodel = GenericFakeChatModel(messages=iter([\"환불 처리 완료.\"]))\nfor chunk in model.stream(\"환불해줘\"):\n    print(repr(chunk.content))\n# 버전에 따라 chunk 분할이 달라질 수 있습니다.", "output": "스트리밍 조각 출력", "q": "stream()에서 주로 순회하는 객체는?", "choices": ["AIMessageChunk", "DataFrame", "SQLConnection"], "correct": 0, "why": "스트리밍은 메시지 조각을 전달합니다."}, {"num": "09", "title": "Runnable 체인 연결", "desc": "Fake 모델도 Runnable이므로 PromptTemplate·출력 파서와 | 연산자로 연결할 수 있습니다. 입력값이 응답 생성에 반영되는 것은 아니라는 점을 기억하세요.", "code": "from langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nprompt = ChatPromptTemplate.from_template(\"질문: {question}\")\nmodel = GenericFakeChatModel(messages=iter([\"미리 준비한 답변\"]))\nchain = prompt | model | StrOutputParser()\nprint(chain.invoke({\"question\": \"반품 가능해?\"}))", "output": "미리 준비한 답변", "q": "체인의 마지막 StrOutputParser()는 무엇을 하나요?", "choices": ["모델의 메시지에서 문자열 출력을 추출한다", "새로운 API 키를 만든다", "모델을 학습시킨다"], "correct": 0, "why": "출력 파서는 텍스트를 사용하기 쉽게 변환합니다."}, {"num": "10", "title": "종합 실습 · 호출 테스트", "desc": "쇼핑몰 FAQ 체인이 예상된 형식으로 동작하는지 assert로 검사합니다. 이 테스트는 LLM의 답변 품질이 아니라 연결 흐름을 확인합니다.", "code": "from langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\nprompt = ChatPromptTemplate.from_template(\"고객 질문: {question}\")\nmodel = GenericFakeChatModel(messages=iter([\"환불은 7일 이내 신청하세요.\"]))\nchain = prompt | model | StrOutputParser()\n\nresult = chain.invoke({\"question\": \"환불 기간은?\"})\nassert result == \"환불은 7일 이내 신청하세요.\"\nprint(\"테스트 통과:\", result)", "output": "테스트 통과: 환불은 7일 이내 신청하세요.", "q": "이 종합 실습으로 가장 직접 검증할 수 있는 것은?", "choices": ["실제 GPT의 정확도", "체인 연결과 반환값 처리", "실제 검색 품질"], "correct": 1, "why": "고정 응답 기반 테스트는 체인 흐름·인터페이스 검증에 적합합니다."}];const lessons=DATA;let index=0;const key='fakechat-course-v1';let passed={};try{passed=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};function h(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function allowed(i){return i===0||!!passed[i-1]}function show(i){if(!allowed(i))return;index=i;const x=lessons[i];document.getElementById('tabs').innerHTML=lessons.map((v,j)=>`<button class="tab ${j===i?'active':''} ${!allowed(j)?'locked':''}" onclick="show(${j})">${v.num} · ${h(v.title)} ${passed[j]?'✓':''}</button>`).join('');document.getElementById('bar').style.width=(Object.keys(passed).length/lessons.length*100)+'%';document.getElementById('stats').textContent=`완료 ${Object.keys(passed).length} / ${lessons.length}`;document.getElementById('content').innerHTML=`<div class="top"><span class="num">STEP ${x.num}</span><span class="tag">${i+1} / ${lessons.length}</span></div><h2>${h(x.title)}</h2><p class="desc">${h(x.desc)}</p><h3>실습 코드</h3><div class="codebox"><button class="copy" onclick="copyCode()">코드 복사</button><pre><code>${h(x.code)}</code></pre></div><h3>예상 결과</h3><div class="output">${h(x.output)}</div><div class="quiz"><strong>이해도 확인 · ${h(x.q)}</strong>${x.choices.map((v,j)=>`<label class="option"><input type="radio" name="ans" value="${j}"> ${j+1}번. ${h(v)}</label>`).join('')}<button class="btn" onclick="check()">정답 확인</button><div id="feedback" class="feedback" aria-live="polite"></div></div><div class="foot"><button class="btn alt" onclick="show(${i-1})" ${i===0?'disabled':''}>이전 단계</button><button class="btn" onclick="show(${i+1})" ${i===9||!allowed(i+1)?'disabled':''}>다음 단계</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}function check(){const selected=document.querySelector('input[name=ans]:checked');const el=document.getElementById('feedback');if(!selected){el.textContent='답을 먼저 선택하세요.';return;}const x=lessons[index];if(Number(selected.value)===x.correct){passed[index]=true;try{localStorage.setItem(key,JSON.stringify(passed))}catch(e){};el.style.color='#157348';el.textContent='정답입니다! '+x.why+' 다음 단계로 이동할 수 있습니다.';showKeep();}else{el.style.color='#ad244d';el.textContent='다시 생각해 보세요. '+x.why;}}function showKeep(){const fb=document.getElementById('feedback').textContent;const i=index;show(i);document.getElementById('feedback').style.color='#157348';document.getElementById('feedback').textContent=fb;}function copyCode(){const code=lessons[index].code;navigator.clipboard.writeText(code).then(()=>{const b=document.querySelector('.copy');b.textContent='복사 완료';setTimeout(()=>b.textContent='코드 복사',1200)}).catch(()=>alert('복사가 제한되어 있습니다. 코드를 직접 선택해주세요.'));}show(0);</script></body></html>
