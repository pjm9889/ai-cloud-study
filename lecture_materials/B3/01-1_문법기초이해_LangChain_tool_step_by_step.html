<script>
const steps=[
{title:'@tool이란?',content:`<p><b>Tool</b>은 AI가 필요할 때 사용할 수 있도록 이름·설명·입력 형식을 갖춘 함수입니다. 일반 Python 함수를 <code>@tool</code>로 꾸미면 LangChain의 도구 객체로 변환됩니다.</p><h3>01. 가장 작은 예제</h3><pre data-code>from langchain.tools import tool

@tool
def hello(name: str) -> str:
    """이름을 받아 인사말을 반환한다."""
    return f"안녕하세요, {name}님!"</pre><div class="tip"> <b>핵심:</b> <code>@tool</code>은 Python 데코레이터입니다. 함수 위에 붙여 LangChain에서 사용할 수 있는 도구 객체로 만듭니다.</div><table><tr><th>문법</th><th>의미</th></tr><tr><td><code>from langchain.tools import tool</code></td><td>도구 데코레이터 가져오기</td></tr><tr><td><code>@tool</code></td><td>함수를 LangChain Tool로 변환</td></tr><tr><td><code>def hello(...)</code></td><td>실제 처리할 Python 코드</td></tr></table><p class="mini">현재 단계에서는 실행하지 않고 구조만 이해합니다.</p>`,question:'@tool의 주된 역할은 무엇인가요?',options:['함수를 자동으로 API 서버에 배포한다','Python 함수를 LangChain 도구 객체로 변환한다','LLM 모델을 학습시킨다'],correct:1,reason:'@tool은 함수의 이름, 설명, 입력 구조를 가진 도구 객체를 만듭니다.'},
{title:'함수 이름과 docstring',content:`<p>AI가 어떤 도구를 사용할지 판단하려면 도구 이름과 설명이 중요합니다.</p><pre data-code>from langchain.tools import tool

@tool
def get_refund_policy(category: str) -> str:
    """상품 종류별 환불 규정을 조회한다."""
    return f"{category}의 환불 규정: 수령 후 7일 이내"

print(get_refund_policy.name)
print(get_refund_policy.description)</pre><h3>02. 결과 이해하기</h3><pre data-code>get_refund_policy
상품 종류별 환불 규정을 조회한다.</pre><p>함수명은 기본 <b>도구 이름</b>이 되고, 함수의 docstring은 기본 <b>설명</b>으로 사용됩니다.</p><div class="tip warn">docstring은 단순한 주석 이상의 역할을 합니다. 도구를 LLM에 제공할 때 어떤 상황에 선택할지 판단하는 정보가 됩니다.</div>`,question:'@tool 함수의 docstring은 보통 어디에 사용될까요?',options:['도구 설명(description)','Python 버전 설정','DB 연결 비밀번호'],correct:0,reason:'docstring이 Tool의 description으로 활용됩니다.'},
{title:'입력 파라미터와 타입 힌트',content:`<p>함수 매개변수의 <b>이름과 타입 힌트</b>로 도구의 입력 구조가 자동 생성됩니다.</p><pre data-code>from langchain.tools import tool

@tool
def shipping_fee(region: str, quantity: int) -> int:
    """지역과 구매 수량으로 배송비를 계산한다."""
    return 5000 if region == "제주" else 3000

print(shipping_fee.args)</pre><p>입력에는 <code>region</code> (문자열), <code>quantity</code> (정수)가 포함됩니다.</p><table><tr><th>문법</th><th>역할</th></tr><tr><td><code>region: str</code></td><td>문자열 파라미터</td></tr><tr><td><code>quantity: int</code></td><td>정수 파라미터</td></tr><tr><td><code>-&gt; int</code></td><td>반환값 타입 힌트</td></tr></table><div class="tip">타입 힌트를 넣으면 도구의 입력 스키마를 더욱 정확히 만들 수 있습니다. 위 예제의 <code>quantity</code>는 스키마 학습을 위한 입력이며 배송비 계산식에서는 사용하지 않습니다.</div>`,question:'quantity: int는 어떤 의미인가요?',options:['quantity라는 전역 변수 생성','quantity가 정수 입력이라는 타입 힌트','quantity의 값이 항상 1이라는 뜻'],correct:1,reason:'매개변수의 타입 힌트는 Tool 입력 스키마 생성에 사용됩니다.'},
{title:'도구 직접 실행: .invoke()',content:`<p><code>@tool</code>을 붙인 이후에는 <code>.invoke()</code>로 직접 실행할 수 있습니다. <b>LLM이나 API 키는 필요하지 않습니다.</b></p><pre data-code>from langchain.tools import tool

@tool
def add(a: int, b: int) -> int:
    """두 정수를 더한다."""
    return a + b

result = add.invoke({"a": 3, "b": 5})
print(result)  # 8</pre><div class="tip"><code>add.invoke({"a": 3, "b": 5})</code>는 도구의 정의된 인자 이름에 맞춰 딕셔너리를 전달합니다.</div><h3>04. 일반 함수와 비교</h3><table><tr><th>일반 Python</th><th>LangChain Tool</th></tr><tr><td><code>add(3, 5)</code></td><td><code>add.invoke({"a":3,"b":5})</code></td></tr></table><div class="tip warn">데코레이터 적용 후의 <code>add</code>는 일반 함수 그 자체가 아닌 Tool 객체입니다. 예전처럼 <code>add(3,5)</code>로 호출하지 말고 <code>.invoke()</code>를 사용합니다.</div>`,question:'@tool로 만든 add(a,b)를 직접 실행하는 올바른 방법은?',options:['add(3, 5)','add.invoke({"a": 3, "b": 5})','add.run(3, 5, 8)'],correct:1,reason:'여러 입력값은 이름을 키로 사용하는 딕셔너리로 전달합니다.'},
{title:'도구 속성 확인: name·description·args',content:`<p>Tool을 만들면 함수 실행 기능뿐 아니라 메타데이터도 확인할 수 있습니다.</p><pre data-code>from langchain.tools import tool

@tool
def stock_count(product_id: int) -> int:
    """상품 번호로 현재 재고 수량을 조회한다."""
    return 12

print(stock_count.name)
print(stock_count.description)
print(stock_count.args)
print(stock_count.invoke({"product_id": 101}))</pre><table><tr><th>속성 / 메서드</th><th>역할</th></tr><tr><td><code>.name</code></td><td>도구 이름</td></tr><tr><td><code>.description</code></td><td>도구의 목적 설명</td></tr><tr><td><code>.args</code></td><td>입력 필드 스키마 확인</td></tr><tr><td><code>.invoke(...)</code></td><td>도구 직접 실행</td></tr></table><p class="mini">재고 12는 예제용 고정 숫자입니다. DB를 실제 조회하는 코드는 아닙니다.</p>`,question:'도구의 입력 스키마를 확인하는 속성은?',options:['.args','.temperature','.response_format'],correct:0,reason:'.args에는 인자별 타입과 필수 여부 등의 스키마 정보가 들어 있습니다.'},
{title:'도구 이름 변경: @tool("이름")',content:`<p>Python 함수명과 외부에 노출하는 도구 이름을 다르게 지정할 수 있습니다.</p><pre data-code>from langchain.tools import tool

@tool("refund_lookup")
def find_policy(category: str) -> str:
    """카테고리별 환불 정책을 찾는다."""
    return f"{category}: 7일 이내 신청 가능"

print(find_policy.name)  # refund_lookup
print(find_policy.invoke({"category": "의류"}))</pre><div class="tip"><code>@tool("refund_lookup")</code>에서 문자열은 도구의 <b>공개 이름</b>을 지정합니다. Python 코드에서 사용하는 변수 이름은 여전히 <code>find_policy</code>입니다.</div>`,question:'@tool("refund_lookup")의 역할은?',options:['환불을 즉시 실행한다','도구의 이름을 refund_lookup으로 지정한다','데이터베이스를 생성한다'],correct:1,reason:'데코레이터의 문자열은 도구에 부여할 이름입니다.'},
{title:'입력 검증: args_schema',content:`<p>기본 타입 힌트만으로 부족하다면 <b>Pydantic</b>으로 입력 스키마와 제약 조건을 정의할 수 있습니다.</p><pre data-code>from langchain.tools import tool
from pydantic import BaseModel, Field

class RefundInput(BaseModel):
    order_id: int = Field(description="주문번호", gt=0)
    reason: str = Field(description="환불 사유")

@tool(args_schema=RefundInput)
def request_refund(order_id: int, reason: str) -> str:
    """주문번호와 사유로 환불 요청을 접수한다."""
    return f"주문 {order_id}: {reason} 접수"

print(request_refund.invoke({"order_id": 10, "reason": "파손"}))</pre><table><tr><th>코드</th><th>역할</th></tr><tr><td><code>BaseModel</code></td><td>입력 구조 정의</td></tr><tr><td><code>Field(description=...)</code></td><td>필드 설명</td></tr><tr><td><code>gt=0</code></td><td>0보다 큰 숫자로 제한</td></tr><tr><td><code>args_schema=RefundInput</code></td><td>도구에 입력 구조 적용</td></tr></table><div class="tip warn">여기서 '접수'는 문자열 반환일 뿐 실제 환불 DB를 변경하지 않습니다.</div>`,question:'order_id: int = Field(gt=0)의 의미는?',options:['order_id가 0보다 커야 한다','order_id가 문자열이어야 한다','order_id를 자동으로 0으로 설정한다'],correct:0,reason:'gt=0은 greater than 0, 즉 0보다 큰 값을 요구하는 제약입니다.'},
{title:'여러 도구를 리스트로 묶기',content:`<p>Agent가 여러 도구를 사용할 수 있도록 도구 객체를 리스트에 넣습니다.</p><pre data-code>from langchain.tools import tool

@tool
def search_policy(keyword: str) -> str:
    """환불 정책을 검색한다."""
    return f"{keyword}: 7일 이내 가능"

@tool
def check_stock(product_id: int) -> str:
    """상품 재고를 확인한다."""
    return f"상품 {product_id}: 재고 5개"

tools = [search_policy, check_stock]

for t in tools:
    print(t.name, "-", t.description)</pre><p>리스트에 넣는다고 자동으로 AI가 도구를 호출하는 것은 아닙니다. 아직은 단순한 Python Tool 객체 모음입니다.</p><div class="tip">Agent에 도구를 연결하는 문법은 다음 단계에서 학습합니다.</div>`,question:'tools = [search_policy, check_stock]가 하는 일은?',options:['LLM을 실행한다','도구 두 개를 리스트로 묶는다','두 도구를 차례로 즉시 실행한다'],correct:1,reason:'리스트는 도구 객체를 보관할 뿐 자동 실행하지 않습니다.'},
{title:'Agent에 도구 연결하기',content:`<p>LangChain 1.x의 <code>create_agent</code>에 Tool 리스트를 넘기면 LLM이 필요에 따라 도구를 선택하도록 구성할 수 있습니다.</p><pre data-code># 설치: pip install -U langchain langchain-openai
# OPENAI_API_KEY 환경변수 설정 필요
from langchain.agents import create_agent
from langchain.tools import tool

@tool
def shipping_policy(region: str) -> str:
    """지역별 배송 정책을 조회한다."""
    return "제주: 기본 배송보다 1~2일 추가 소요"

agent = create_agent(
    model="openai:gpt-4.1-mini",
    tools=[shipping_policy]
)

result = agent.invoke({
    "messages": [{"role": "user", "content": "제주 배송은 더 오래 걸리나요?"}]
})
print(result["messages"][-1].content)</pre><div class="tip warn">이 단계부터 <b>OpenAI API 키 및 사용 요금</b>이 필요합니다. 모델이 실제로 도구를 호출할지는 모델 판단에 따라 달라질 수 있습니다.</div><h3>09. 역할 분담</h3><table><tr><th>요소</th><th>역할</th></tr><tr><td><code>@tool</code></td><td>호출 가능한 도구 정의</td></tr><tr><td><code>tools=[...]</code></td><td>Agent에 도구 제공</td></tr><tr><td><code>agent.invoke(...)</code></td><td>사용자 질문 처리 시작</td></tr></table>`,question:'create_agent(..., tools=[shipping_policy])의 목적은?',options:['Tool 함수를 파일에 저장한다','Agent가 사용할 수 있는 도구를 제공한다','Python을 자동 설치한다'],correct:1,reason:'tools 인자에 도구 목록을 제공하면 Agent가 필요할 때 도구를 사용할 수 있습니다.'},
{title:'종합 실습 · 문법 정리',content:`<p>이번에는 <b>API 키 없이</b> 도구 두 개를 정의하고 직접 실행해 보겠습니다.</p><pre data-code>from langchain.tools import tool

@tool
def calculate_discount(price: int, rate: int) -> int:
    """상품 가격과 할인율(%)로 할인 후 금액을 계산한다."""
    return price * (100 - rate) // 100

@tool
def get_delivery_days(region: str) -> str:
    """지역별 예상 배송 기간을 알려준다."""
    return "3~5일" if region == "제주" else "1~3일"

print(calculate_discount.invoke({"price": 10000, "rate": 10}))

let current=0;const completed=new Set();const stateKey='langchain_tool_course_v1';try{const saved=JSON.parse(localStorage.getItem(stateKey)||'[]');saved.forEach(x=>{if(Number.isInteger(x)&&x>=0&&x<steps.length)completed.add(x)})}catch(e){};
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(stateKey,JSON.stringify([...completed]))}catch(e){}}
function renderNav(){el('sidebar').innerHTML='<h2>학습 단계</h2>'+steps.map((s,i)=>`<button class="tab ${i===current?'active':''} ${completed.has(i)?'done':''} ${i>0&&!completed.has(i-1)?'locked':''}" data-step="${i}" ${i>0&&!completed.has(i-1)?'disabled':''}><span class="num">${String(i+1).padStart(2,'0')}${completed.has(i)?' ✓':''}</span><span>${s.title}</span></button>`).join('');el('sidebar').querySelectorAll('button[data-step]').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.step;render()}))}
function render(){let s=steps[current];el('stepNum').textContent=`STEP ${String(current+1).padStart(2,'0')} / ${steps.length}`;el('stepTitle').textContent=s.title;el('content').innerHTML=s.content;el('content').querySelectorAll('pre[data-code]').forEach(pre=>{const txt=pre.textContent;const div=document.createElement('div');div.className='codewrap';const cp=document.createElement('button');cp.className='copy';cp.textContent='코드 복사';cp.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(txt);cp.textContent='복사됨 ✓'}catch(e){cp.textContent='복사 실패'}setTimeout(()=>cp.textContent='코드 복사',1600)});pre.replaceWith(div);div.append(pre,cp)});let quiz=el('quiz');quiz.innerHTML=`<h3>이해도 확인 ${String(current+1).padStart(2,'0')}</h3><p><b>${s.question}</b></p>${s.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"> ${String.fromCharCode(9312+i)} ${o.replaceAll('<','&lt;')}</label>`).join('')}<div class="actions"><button class="btn primary" id="check">정답 확인</button><span class="feedback" id="feedback"></span></div>`;el('check').addEventListener('click',()=>{const checked=quiz.querySelector('input:checked');if(!checked){el('feedback').className='feedback wrong';el('feedback').textContent='답을 먼저 선택하세요.';return}const good=+checked.value===s.correct;el('feedback').className='feedback '+(good?'good':'wrong');el('feedback').textContent=(good?'정답입니다! ':'다시 생각해 보세요. ')+s.reason;if(good){completed.add(current);save();renderNav();updateProgress();el('next').disabled=current===steps.length-1;el('next').textContent=current===steps.length-1?'전체 학습 완료 ✓':'다음 단계 →'}});el('prev').disabled=current===0;el('next').disabled=current===steps.length-1||!completed.has(current);el('next').textContent=current===steps.length-1&&completed.has(current)?'전체 학습 완료 ✓':'다음 단계 →';updateProgress();renderNav();window.scrollTo({top:0,behavior:'smooth'})}
function updateProgress(){el('progressLabel').textContent=`학습 완료 ${completed.size} / ${steps.length}`;el('progressBar').style.width=(completed.size/steps.length*100)+'%'}
el('prev').addEventListener('click',()=>{if(current>0){current--;render()}});el('next').addEventListener('click',()=>{if(current<steps.length-1&&completed.has(current)){current++;render()}});render();
