:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#202637;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#162641;color:white;padding:24px max(24px,calc((100vw - 1100px)/2));}.eyebrow{font-size:12px;color:#ffb6cd;letter-spacing:1px;font-weight:800}.top h1{font-size:26px;margin:7px 0}.top p{margin:0;color:#d5dce7}.main{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:230px 1fr;gap:18px}.side,.panel{background:white;border:1px solid #e4e8ef;border-radius:15px;padding:20px}.side{align-self:start;position:sticky;top:12px}.side h3{font-size:14px;margin:0 0 13px}.tabs{display:flex;flex-direction:column;gap:7px}.tab{border:1px solid #e7e8f0;background:#fff;border-radius:9px;text-align:left;padding:10px;cursor:pointer;color:#374151;font-size:13px}.tab.active{background:#fff0f5;border-color:#ea79a4;color:#a21d53;font-weight:700}.tab:disabled{opacity:.43;cursor:not-allowed}.progress{height:8px;background:#e9edf5;border-radius:20px;overflow:hidden;margin-top:17px}.bar{height:100%;background:#db4d83;width:0;transition:width .2s}.small{color:#667085;font-size:12px;margin-top:8px}.step{font-size:13px;color:#be346c;font-weight:800}.panel h2{font-size:23px;margin:10px 0}.desc{font-size:15px;line-height:1.8;color:#4b5563}.section{font-weight:700;margin:26px 0 9px}.codewrap{background:#151b2b;border-radius:11px;overflow:hidden}.codebar{background:#283247;color:#d1d8e5;display:flex;justify-content:space-between;align-items:center;padding:8px 13px;font-size:12px}.copy{background:#414f68;border:0;color:white;padding:6px 10px;border-radius:6px;cursor:pointer}pre{margin:0;white-space:pre;overflow:auto;color:#f1f5f9;padding:18px;line-height:1.6;font-size:13px;tab-size:4}.quiz{background:#fbfbfd;border:1px solid #e5e7eb;border-radius:12px;padding:17px;margin-top:24px}.quiz h3{margin:0 0 13px;font-size:16px}.option{display:block;background:white;padding:11px;border:1px solid #dbe0e8;border-radius:8px;margin:8px 0;cursor:pointer}.option input{margin-right:8px;accent-color:#be346c}.btn{border:0;border-radius:9px;background:#be346c;color:#fff;padding:11px 16px;cursor:pointer;font-weight:700}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:white;color:#374151;border:1px solid #d1d5db}.feedback{margin:12px 0;padding:11px;border-radius:8px;background:#eef9f1;color:#176c38;display:none}.feedback.wrong{background:#fff0f0;color:#9c2525}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.links{font-size:12px;color:#64748b;margin-top:26px;line-height:1.9}.links a{color:#a62b60}.note{background:#fff6e8;border-left:3px solid #dba345;padding:12px;margin-top:15px;font-size:13px;color:#6b4c19}@media(max-width:760px){.main{display:block}.side{position:static;margin-bottom:14px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:22px}.panel h2{font-size:21px}}
</style></head><body><header class="top"><div class="eyebrow">부성순 · LANGGRAPH STEP BY STEP</div><h1>ToolNode · tools_condition</h1><p>한 단계씩 실습하고, 이해도 확인 후 다음 단계로 이동</p></header><main class="main"><aside class="side"><h3>학습 단계</h3><div id="tabs" class="tabs"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="progress" class="small"></div></aside><article class="panel"><div id="stepnum" class="step"></div><h2 id="title"></h2><div id="desc" class="desc"></div><div class="section">파이썬 실습 코드</div><div class="codewrap"><div class="codebar"><span>Python · 복사 후 실행</span><button class="copy" id="copy">코드 복사</button></div><pre><code id="code"></code></pre></div><div id="note" class="note"></div><section class="quiz"><h3 id="question"></h3><div id="options"></div><button id="check" class="btn">정답 확인</button><div id="feedback" class="feedback"></div></section><div class="nav"><button class="btn secondary" id="prev">← 이전 단계</button><button class="btn" id="next" disabled>다음 단계 →</button></div><div class="links">참고: <a target="_blank" rel="noopener" href="https://reference.langchain.com/python/langgraph.prebuilt/tool_node/ToolNode">ToolNode 공식 API</a> · <a target="_blank" rel="noopener" href="https://reference.langchain.com/python/langgraph.prebuilt/tool_node/tools_condition">tools_condition 공식 API</a><br>권장 환경: <code>pip install -U langgraph langchain-core</code> · 09단계 추가: <code>pip install -U langchain-openai</code></div></article></main><script>
const steps=[{"num": "01", "title": "역할 먼저 이해하기", "desc": "ToolNode는 도구를 실제 실행하고, tools_condition은 도구 실행이 필요한지 판별합니다.", "code": "from langgraph.prebuilt import ToolNode, tools_condition\n\n# ToolNode: 도구를 실행하는 노드\n# tools_condition: 도구 호출 여부를 보고 경로를 정하는 함수", "question": "ToolNode와 tools_condition 중 실제 파이썬 도구를 실행하는 것은?", "options": ["ToolNode", "tools_condition", "START"], "answer": 0, "explain": "ToolNode는 실행 담당, tools_condition은 조건 판단 담당입니다."}, {"num": "02", "title": "@tool로 도구 만들기", "desc": "먼저 실행할 도구를 준비합니다. docstring은 도구 설명으로 쓰입니다.", "code": "from langchain_core.tools import tool\n\n@tool\ndef add(a: int, b: int) -> int:\n    \"\"\"두 정수를 더합니다.\"\"\"\n    return a + b\n\nprint(add.invoke({\"a\": 3, \"b\": 4}))  # 7", "question": "@tool로 감싼 도구를 직접 호출할 때 사용하는 메서드는?", "options": [".run_graph()", ".invoke()", ".route()"], "answer": 1, "explain": "@tool 함수는 BaseTool 형태가 되고 .invoke()로 실행할 수 있습니다."}, {"num": "03", "title": "ToolNode 만들기", "desc": "여러 도구를 리스트로 넘겨 ToolNode를 만듭니다. 생성만으로 실행되지는 않습니다.", "code": "from langgraph.prebuilt import ToolNode\n\nnode = ToolNode([add])\nprint(list(node.tools_by_name.keys()))  # ['add']", "question": "ToolNode([add]) 코드의 의미는?", "options": ["add 도구를 실행할 수 있는 노드를 만든다", "add를 즉시 한 번 실행한다", "그래프를 종료한다"], "answer": 0, "explain": "ToolNode 생성과 도구 실행은 별개입니다."}, {"num": "04", "title": "ToolNode 직접 실행", "desc": "LLM 없이도 tool_call 형식으로 실행을 시험할 수 있습니다. id는 도구 호출을 식별합니다.", "code": "from langgraph.prebuilt import ToolNode\n\nnode = ToolNode([add])\n\ncalls = [\n    {\"name\": \"add\", \"args\": {\"a\": 3, \"b\": 4},\n     \"id\": \"call_1\", \"type\": \"tool_call\"}\n]\nresult = node.invoke(calls)\nprint(result[0].content)       # 7\nprint(result[0].tool_call_id)  # call_1", "question": "위 결과의 메시지 종류는?", "options": ["HumanMessage", "ToolMessage", "SystemMessage"], "answer": 1, "explain": "ToolNode는 도구 실행 결과를 ToolMessage로 돌려줍니다."}, {"num": "05", "title": "AIMessage와 tool_calls", "desc": "모델이 도구 사용을 요청할 때 AIMessage의 tool_calls에 이름·인자·ID가 담깁니다. ToolNode는 이를 읽어 실행합니다.", "code": "from langchain_core.messages import AIMessage\n\nmsg = AIMessage(\n    content=\"\",\n    tool_calls=[\n        {\"name\": \"add\", \"args\": {\"a\": 5, \"b\": 6}, \"id\": \"c1\"}\n    ]\n)\nprint(msg.tool_calls)\nprint(ToolNode([add]).invoke([msg])[0].content)  # 11", "question": "도구 실행 요청 정보는 주로 어디에 있나요?", "options": ["AIMessage.tool_calls", "HumanMessage.name", "SystemMessage.content"], "answer": 0, "explain": "AIMessage.tool_calls가 도구 실행 요청을 담습니다."}, {"num": "06", "title": "tools_condition 단독 실습", "desc": "마지막 AIMessage에 tool_calls가 있으면 \"tools\", 없으면 \"__end__\"를 반환합니다.", "code": "from langgraph.prebuilt import tools_condition\nfrom langchain_core.messages import AIMessage\n\nwith_tool = AIMessage(\n    content=\"\", tool_calls=[\n        {\"name\": \"add\", \"args\": {\"a\": 1, \"b\": 2}, \"id\": \"c2\"}\n    ]\n)\nwithout_tool = AIMessage(content=\"도구가 필요 없습니다.\")\n\nprint(tools_condition({\"messages\": [with_tool]}))     # tools\nprint(tools_condition({\"messages\": [without_tool]}))  # __end__", "question": "마지막 AIMessage에 tool_calls가 없으면?", "options": ["tools", "__end__", "add"], "answer": 1, "explain": "도구 호출 요청이 없으면 종료 경로를 선택합니다."}, {"num": "07", "title": "조건부 엣지에 연결하기", "desc": "add_conditional_edges에 tools_condition을 등록합니다. tools라는 이름의 노드가 필요합니다.", "code": "from langgraph.graph import StateGraph, MessagesState, START, END\nfrom langgraph.prebuilt import ToolNode, tools_condition\n\nbuilder = StateGraph(MessagesState)\nbuilder.add_node(\"agent\", agent_node)  # 다음 단계에서 정의\nbuilder.add_node(\"tools\", ToolNode([add]))\nbuilder.add_edge(START, \"agent\")\nbuilder.add_conditional_edges(\"agent\", tools_condition)\nbuilder.add_edge(\"tools\", \"agent\")\n# graph = builder.compile()  # agent_node 정의 후 실행", "question": "tools_condition이 \"tools\"를 반환하면?", "options": ["tools라는 이름의 노드로 이동", "아무 도구나 자동 선택", "항상 END로 이동"], "answer": 0, "explain": "기본 조건 함수의 반환 문자열과 노드 이름이 맞아야 합니다."}, {"num": "08", "title": "완전 실행: API 없는 최소 그래프", "desc": "LLM 대신 고정된 AIMessage를 반환하는 가짜 agent를 사용해 도구 호출 → 결과 확인 → 종료를 시험합니다.", "code": "from langchain_core.tools import tool\nfrom langchain_core.messages import AIMessage, ToolMessage, HumanMessage\nfrom langgraph.graph import StateGraph, MessagesState, START\nfrom langgraph.prebuilt import ToolNode, tools_condition\n\n@tool\ndef add(a: int, b: int) -> int:\n    \"\"\"두 수를 더합니다.\"\"\"\n    return a + b\n\ndef agent_node(state: MessagesState):\n    last = state[\"messages\"][-1]\n    if isinstance(last, ToolMessage):\n        return {\"messages\": [AIMessage(content=f\"답은 {last.content}입니다.\")]}\n    return {\"messages\": [AIMessage(content=\"\", tool_calls=[\n        {\"name\": \"add\", \"args\": {\"a\": 3, \"b\": 4}, \"id\": \"call_1\"}\n    ])]}\n\nbuilder = StateGraph(MessagesState)\nbuilder.add_node(\"agent\", agent_node)\nbuilder.add_node(\"tools\", ToolNode([add]))\nbuilder.add_edge(START, \"agent\")\nbuilder.add_conditional_edges(\"agent\", tools_condition)\nbuilder.add_edge(\"tools\", \"agent\")\ngraph = builder.compile()\n\nresult = graph.invoke({\"messages\": [HumanMessage(content=\"3+4는?\")]})\nprint(result[\"messages\"][-1].content)  # 답은 7입니다.", "question": "위 예제에서 tools 실행이 끝나면 다음으로 어디에 가나요?", "options": ["agent 노드", "START", "바로 END"], "answer": 0, "explain": "tools → agent 엣지로 돌아가고, 마지막 답변에는 tool_calls가 없어 종료됩니다."}, {"num": "09", "title": "실제 LLM과 연결하기", "desc": "ChatOpenAI.bind_tools()로 모델에 도구 목록을 알려줍니다. 모델이 항상 도구를 호출하는 것은 아닙니다. API 키와 비용이 필요합니다.", "code": "# pip install -U langgraph langchain-openai\n# 환경변수 OPENAI_API_KEY 설정 필요\nfrom langchain_openai import ChatOpenAI\nfrom langchain_core.tools import tool\nfrom langgraph.graph import StateGraph, MessagesState, START\nfrom langgraph.prebuilt import ToolNode, tools_condition\n\n@tool\ndef add(a: int, b: int) -> int:\n    \"\"\"두 정수를 더합니다.\"\"\"\n    return a + b\n\nmodel = ChatOpenAI(model=\"gpt-4.1-mini\").bind_tools([add])\n\ndef agent(state: MessagesState):\n    return {\"messages\": [model.invoke(state[\"messages\"])]}\n\nbuilder = StateGraph(MessagesState)\nbuilder.add_node(\"agent\", agent)\nbuilder.add_node(\"tools\", ToolNode([add]))\nbuilder.add_edge(START, \"agent\")\nbuilder.add_conditional_edges(\"agent\", tools_condition)\nbuilder.add_edge(\"tools\", \"agent\")\ngraph = builder.compile()\n\nresult = graph.invoke({\"messages\": [(\"user\", \"12와 35를 더해줘. add 도구를 사용해.\")]})\nprint(result[\"messages\"][-1].content)", "question": "bind_tools([add])의 목적은?", "options": ["모델에 사용할 수 있는 도구 스키마를 알리기", "도구를 무조건 즉시 실행하기", "LangGraph를 저장하기"], "answer": 0, "explain": "bind_tools는 도구 정보를 모델에 제공하고, 실제 실행은 ToolNode가 수행합니다."}, {"num": "10", "title": "문법 정리와 종합 점검", "desc": "도구 요청 생성과 실행, 조건 판단, 결과 전달을 구분합니다. 일반적인 에이전트에는 create_agent를 쓸 수도 있지만, 여기서는 LangGraph 제어 흐름을 배우는 것이 목표입니다.", "code": "# 전체 흐름\n# 1. agent → AIMessage(tool_calls=[...])\n# 2. tools_condition → \"tools\"\n# 3. ToolNode → ToolMessage\n# 4. tools → agent\n# 5. agent → AIMessage(content=\"최종 답\", tool_calls=[])\n# 6. tools_condition → \"__end__\"\n\n# 주의: 사용자 메시지(HumanMessage)에 도구명을 적는 것만으로\n# ToolNode가 도구를 실행하지는 않습니다.\n# 도구 실행은 AIMessage.tool_calls를 통해 요청됩니다.", "question": "다음 중 올바른 역할 구분은?", "options": ["tools_condition은 실행, ToolNode는 경로 판단", "둘 다 LLM을 직접 호출", "ToolNode는 실행, tools_condition은 경로 판단"], "answer": 2, "explain": "핵심은 실행(ToolNode)과 분기(tools_condition)를 구분하는 것입니다."}];let current=0;const completed=new Set();let selected=null;const $=id=>document.getElementById(id);
function render(){const s=steps[current];$('stepnum').textContent=`STEP ${s.num} / ${steps.length}`;$('title').textContent=s.title;$('desc').textContent=s.desc;$('code').textContent=s.code;$('question').textContent='이해도 확인 · '+s.question;$('note').textContent=current===6?'이 단계 코드는 연결 방법을 소개하는 부분 예제입니다. 전체 실행 코드는 STEP 08에 있습니다.':current===8?'이 단계는 OpenAI API 호출이 발생하므로 API 키와 비용이 필요합니다.': '이 단계의 예제는 학습용입니다. 코드를 복사해 직접 실행하며 결과를 확인하세요.';$('options').innerHTML='';s.options.forEach((v,i)=>{let l=document.createElement('label');l.className='option';let inp=document.createElement('input');inp.type='radio';inp.name='ans';inp.checked=selected===i;inp.onchange=()=>selected=i;l.append(inp,document.createTextNode(String(i+1)+'. '+v));$('options').append(l)});$('feedback').style.display='none';$('next').disabled=!completed.has(current)||current===steps.length-1;$('next').textContent=current===steps.length-1?'학습 완료':'다음 단계 →';$('prev').disabled=current===0;drawTabs();}
function drawTabs(){$('tabs').innerHTML='';steps.forEach((s,i)=>{let b=document.createElement('button');b.className='tab'+(i===current?' active':'');b.disabled=i>0&&!completed.has(i-1);b.textContent=`${s.num} · ${s.title}${completed.has(i)?' ✓':''}`;b.onclick=()=>{current=i;selected=null;render()};$('tabs').append(b)});$('bar').style.width=(completed.size/steps.length*100)+'%';$('progress').textContent=`${completed.size} / ${steps.length} 단계 완료`}
$('check').onclick=()=>{if(selected===null){alert('답을 먼저 선택해주세요.');return}const s=steps[current],ok=selected===s.answer;const f=$('feedback');f.style.display='block';f.className='feedback'+(ok?'':' wrong');f.textContent=(ok?'정답입니다! ':'다시 생각해 보세요. ')+(ok?s.explain:'다른 선택지를 골라 다시 확인해주세요.');if(ok){completed.add(current);$('next').disabled=current===steps.length-1;drawTabs()}};$('next').onclick=()=>{if(completed.has(current)&&current<steps.length-1){current++;selected=null;render()}};$('prev').onclick=()=>{if(current>0){current--;selected=null;render()}};$('copy').onclick=async()=>{const t=steps[current].code;try{await navigator.clipboard.writeText(t);$('copy').textContent='복사 완료'}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();$('copy').textContent='복사 완료'}setTimeout(()=>$('copy').textContent='코드 복사',1400)};render();
</script></body></html>
