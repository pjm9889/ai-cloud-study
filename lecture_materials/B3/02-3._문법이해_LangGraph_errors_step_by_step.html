<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LangGraph errors 단계별 학습</title><style>
:root{font-family: "Segoe UI", "Malgun Gothic",sans-serif;color:#263043;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}header{background:#17243c;color:white;padding:23px max(24px,calc((100vw - 1180px)/2));border-bottom:4px solid #ef6094}header .eyebrow{color:#ffb7d1;font-size:13px;font-weight:700}header h1{margin:8px 0;font-size:26px}header small{color:#c8d3e4}main{max-width:1180px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:20px}nav,.pane{background:white;border:1px solid #e3e7ef;border-radius:14px;box-shadow:0 3px 16px #0f172a0a}nav{padding:13px;align-self:start;position:sticky;top:18px}.navtitle{font-size:12px;color:#64748b;font-weight:800;padding:12px 10px}.tab{display:flex;gap:9px;text-align:left;width:100%;padding:12px 10px;border:0;border-radius:9px;background:transparent;color:#475569;cursor:pointer;font-weight:600;line-height:1.35}.tab:hover{background:#f8eaf1}.tab.active{background:#ffe8f0;color:#aa255e}.tab:disabled{opacity:.4;cursor:not-allowed}.num{color:#d64b82;min-width:24px}.pane{padding:28px 34px;min-height:600px}.stage{color:#c13d73;font-size:13px;font-weight:800}.pane h2{font-size:24px;margin:10px 0 15px}.desc{font-size:16px;line-height:1.9;margin-bottom:20px}.codewrap{position:relative;background:#152134;color:#edf3fb;border-radius:12px;overflow:hidden}.copy{position:absolute;right:12px;top:10px;color:white;background:#354761;border:1px solid #64748b;border-radius:7px;padding:6px 12px;cursor:pointer}pre{margin:0;padding:49px 20px 22px;overflow:auto;font-size:13px;line-height:1.75;tab-size:4}code{font-family:Consolas,'Courier New',monospace}.note{margin:19px 0 28px;background:#f5f7fa;border-left:4px solid #e96a9a;border-radius:8px;padding:15px;line-height:1.75}.quiz{border-top:1px solid #e8edf2;padding-top:22px}.quiz h3{font-size:17px;margin:0 0 12px}.option{display:block;border:1px solid #e2e8f0;margin:9px 0;padding:12px 14px;border-radius:8px;cursor:pointer}.option:hover{border-color:#f092b4}.option input{margin-right:9px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button.primary{background:#d93876;color:white;border:0;border-radius:8px;padding:11px 17px;font-size:14px;cursor:pointer;font-weight:700}button.secondary{background:#f2f4f8;color:#334155;border:1px solid #e2e8f0;border-radius:8px;padding:11px 17px;cursor:pointer}.feedback{min-height:28px;margin-top:12px;font-weight:700}.ok{color:#15803d}.bad{color:#b91c1c}.progress{height:7px;background:#e8eaf0;border-radius:20px;overflow:hidden;margin-top:13px}.progress div{height:100%;background:#e34b83;transition:width .2s}footer{max-width:1180px;margin:0 auto 24px;color:#64748b;font-size:12px;padding:0 18px}footer a{color:#a82e62}@media(max-width:780px){main{display:block}nav{position:static;margin-bottom:15px;display:flex;overflow-x:auto;padding:10px}.navtitle{display:none}.tab{min-width:130px}.pane{padding:21px 17px}header h1{font-size:21px}}
</style></head><body><header><div class="eyebrow">부성순 · LANGGRAPH STEP BY STEP</div><h1>from langgraph.errors import ...</h1><small>오류 종류 → 예외 처리 → 반복 그래프 → 상태 업데이트 → 실무 대응</small></header><main><nav><div class="navtitle">학습 단계</div><div id="tabs"></div><div class="progress"><div id="bar"></div></div><div id="count" style="padding:9px;color:#64748b;font-size:12px"></div></nav><article class="pane" id="pane"></article></main><footer>설치: <code>pip install -U langgraph</code> · 공식 문서: <a href="https://reference.langchain.com/python/langgraph/errors" target="_blank" rel="noopener">LangGraph errors API</a> · 학습용 코드 / 진행상황은 이 브라우저에 저장됩니다.</footer><script>
const steps = [{"num": "01", "title": "import 문법과 오류 클래스", "desc": "`langgraph.errors`는 그래프 실행 중 생기는 오류를 정의한 모듈입니다. `error`가 아니라 복수형 `errors`를 사용합니다.", "code": "from langgraph.errors import GraphRecursionError, InvalidUpdateError\nprint(GraphRecursionError.__name__)\nprint(InvalidUpdateError.__name__)", "note": "GraphRecursionError는 반복 실행 제한, InvalidUpdateError는 상태 업데이트 오류와 관련됩니다.", "q": "정확한 import 경로는 무엇일까요?", "choices": ["langgraph.error", "langgraph.errors", "langgraph.exception"], "answer": 1, "explain": "Python 모듈 이름은 errors입니다."}, {"num": "02", "title": "예외(Exception)와 try/except", "desc": "LangGraph 오류 클래스는 Python 예외 처리 문법으로 잡습니다. 먼저 일반적인 예외 처리부터 확인합니다.", "code": "try:\n    raise ValueError(\"잘못된 값\")\nexcept ValueError as e:\n    print(\"오류 처리:\", e)", "note": "일부 오류는 프로그램을 종료시키지 않고 대응할 수 있습니다. 오류를 무조건 숨기기보다는 원인을 출력하고 처리하세요.", "q": "except 블록은 언제 실행될까요?", "choices": ["try 안에서 지정한 예외가 발생할 때", "항상 실행될 때", "문법 오류를 자동 수정할 때"], "answer": 0, "explain": "해당 예외가 발생한 경우에 실행됩니다."}, {"num": "03", "title": "GraphRecursionError란?", "desc": "그래프의 실행 단계(super-step)가 설정한 `recursion_limit`을 초과하면 GraphRecursionError가 발생합니다. Python 재귀 함수의 호출 깊이와 같은 개념은 아닙니다.", "code": "from langgraph.errors import GraphRecursionError\n\ntry:\n    raise GraphRecursionError(\"실행 단계 제한 초과\")\nexcept GraphRecursionError as e:\n    print(\"반복 제한 오류:\", e)", "note": "이 예제는 예외 객체를 직접 발생시켜 catch 문법을 연습합니다. 실제 그래프에서 발생시키는 코드는 다음 단계에서 진행합니다.", "q": "이 오류가 뜻하는 것은?", "choices": ["LLM API 키 누락", "그래프 실행 단계 제한 초과", "리스트 인덱스 범위 초과"], "answer": 1, "explain": "그래프 실행 단계 제한과 관련됩니다."}, {"num": "04", "title": "반복 그래프로 오류 재현", "desc": "END로 나가지 않고 자기 노드로 되돌아오는 그래프를 실행하여 GraphRecursionError를 직접 확인합니다.", "code": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, START\nfrom langgraph.errors import GraphRecursionError\n\nclass State(TypedDict):\n    count: int\n\ndef loop_node(state: State):\n    return {\"count\": state[\"count\"] + 1}\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"loop\", loop_node)\nbuilder.add_edge(START, \"loop\")\nbuilder.add_edge(\"loop\", \"loop\")\ngraph = builder.compile()\n\ntry:\n    graph.invoke({\"count\": 0}, config={\"recursion_limit\": 4})\nexcept GraphRecursionError:\n    print(\"반복 제한에 도달했습니다\")", "note": "`recursion_limit`은 실행 설정의 최상위 키이며, `configurable` 안에 넣지 않습니다.", "q": "recursion_limit은 어디에 설정할까요?", "choices": ["graph.invoke의 config 최상위", "State의 문자열 값", "add_node의 첫 번째 인수"], "answer": 0, "explain": "config={\"recursion_limit\": 4} 형태입니다."}, {"num": "05", "title": "무조건 limit만 올리면 될까?", "desc": "반복 제한을 높여도 종료 조건이 없다면 다시 오류가 납니다. 올바른 해결은 조건을 두어 END에 도달하게 만드는 것입니다.", "code": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\n\nclass State(TypedDict):\n    count: int\n\ndef count_node(state: State):\n    return {\"count\": state[\"count\"] + 1}\n\ndef route(state: State):\n    return \"end\" if state[\"count\"] >= 3 else \"again\"\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"count\", count_node)\nbuilder.add_edge(START, \"count\")\nbuilder.add_conditional_edges(\n    \"count\", route, {\"again\": \"count\", \"end\": END}\n)\ngraph = builder.compile()\nprint(graph.invoke({\"count\": 0}))", "note": "예상 결과: {\"count\": 3}. 실제로 종료할 수 있는 경로를 만들어야 합니다.", "q": "반복 제한 오류의 근본 해결책은?", "choices": ["항상 limit을 1만으로 높이기", "종료 조건과 END 경로 점검", "모든 오류 무시"], "answer": 1, "explain": "종료 가능 여부를 먼저 확인합니다."}, {"num": "06", "title": "InvalidUpdateError란?", "desc": "노드가 StateGraph의 상태 업데이트 규칙에 맞지 않는 값을 반환할 때 발생할 수 있습니다. 대표 사례는 dict 대신 문자열을 반환하는 경우입니다.", "code": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\nfrom langgraph.errors import InvalidUpdateError\n\nclass State(TypedDict):\n    answer: str\n\ndef bad_node(state: State):\n    return \"완료\"  # 잘못된 반환값: dict가 아님\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"bad\", bad_node)\nbuilder.add_edge(START, \"bad\")\nbuilder.add_edge(\"bad\", END)\ngraph = builder.compile()\n\ntry:\n    graph.invoke({\"answer\": \"\"})\nexcept InvalidUpdateError as e:\n    print(type(e).__name__)\n    print(str(e)[:250])", "note": "StateGraph 노드는 보통 {\"필드명\": 값} 형태의 상태 업데이트를 반환합니다.", "q": "잘못된 노드 반환값은?", "choices": ["{\"answer\":\"완료\"}", "{\"answer\":\"처리중\"}", "\"완료\""], "answer": 2, "explain": "문자열 단독 반환은 상태 업데이트 dict가 아닙니다."}, {"num": "07", "title": "InvalidUpdateError 해결", "desc": "State 키를 맞추고 dict 형태로 반환하면 앞 단계의 문제를 해결할 수 있습니다.", "code": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\n\nclass State(TypedDict):\n    answer: str\n\ndef good_node(state: State):\n    return {\"answer\": \"완료\"}\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"good\", good_node)\nbuilder.add_edge(START, \"good\")\nbuilder.add_edge(\"good\", END)\ngraph = builder.compile()\nprint(graph.invoke({\"answer\": \"\"}))", "note": "예상 결과: {\"answer\": \"완료\"}.", "q": "정상적인 상태 업데이트 반환은?", "choices": ["[\"answer\", \"완료\"]", "{\"answer\": \"완료\"}", "\"answer=완료\""], "answer": 1, "explain": "StateGraph에서는 상태 필드를 dict로 업데이트합니다."}, {"num": "08", "title": "동시 업데이트 충돌", "desc": "같은 실행 단계에서 서로 다른 병렬 노드가 하나의 일반 State 키에 동시에 값을 쓰면 InvalidUpdateError가 발생할 수 있습니다.", "code": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\nfrom langgraph.errors import InvalidUpdateError\n\nclass State(TypedDict):\n    result: str\n\ndef node_a(state: State):\n    return {\"result\": \"A\"}\n\ndef node_b(state: State):\n    return {\"result\": \"B\"}\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"a\", node_a)\nbuilder.add_node(\"b\", node_b)\nbuilder.add_edge(START, \"a\")\nbuilder.add_edge(START, \"b\")\nbuilder.add_edge(\"a\", END)\nbuilder.add_edge(\"b\", END)\ngraph = builder.compile()\ntry:\n    graph.invoke({\"result\": \"\"})\nexcept InvalidUpdateError as e:\n    print(\"동시 업데이트 오류:\", type(e).__name__)", "note": "병렬 쓰기가 필요한 경우 서로 다른 상태 키를 쓰거나, `Annotated` reducer를 정의해 업데이트를 병합하도록 설계할 수 있습니다.", "q": "동일 키 병렬 업데이트를 안전하게 처리하려면?", "choices": ["reducer 등 병합 규칙 정의", "항상 try/except 삭제", "키 이름만 출력"], "answer": 0, "explain": "병합 규칙(reducer) 또는 상태 구조 변경을 고려합니다."}, {"num": "09", "title": "GraphInterrupt와 interrupt의 구별", "desc": "`GraphInterrupt`는 LangGraph의 내부 중단 제어와 관련된 예외입니다. 일반적인 사람 승인 대기는 `langgraph.types.interrupt()`와 `Command(resume=...)`를 사용해야 합니다. 일반적인 except Exception으로 내부 중단을 방해하지 않도록 주의하세요.", "code": "from langgraph.types import interrupt, Command\nfrom langgraph.errors import GraphInterrupt\n\n# 승인 대기 코드는 다음처럼 노드 안에 작성합니다.\ndef approval_node(state):\n    answer = interrupt(\"승인하시겠습니까?\")\n    return {\"approval\": answer}\n\n# GraphInterrupt를 직접 raise하는 패턴은 권장하지 않습니다.\n# 이어서 실행하려면 체크포인터/동일 thread_id와 함께\n# graph.invoke(Command(resume=\"승인\"), config=config)를 사용합니다.", "note": "이 단계의 함수는 예시 정의만 합니다. 실제로 실행할 때는 체크포인터와 thread_id가 설정된 그래프가 필요합니다.", "q": "승인 대기 구현에 권장되는 것은?", "choices": ["raise GraphInterrupt() 직접 사용", "interrupt()와 Command(resume=...)", "InvalidUpdateError 직접 발생"], "answer": 1, "explain": "사용자 승인에는 public interrupt API를 사용합니다."}, {"num": "10", "title": "종합: 오류 분류와 대응", "desc": "오류 메시지를 보고 원인을 분류하고, 종료 경로·상태 반환값·병렬 업데이트 규칙을 점검합니다. 실무에서는 예외를 로깅하고 필요한 범위에서만 잡아야 합니다.", "code": "from langgraph.errors import GraphRecursionError, InvalidUpdateError\n\ndef run_safely(graph, data, config=None):\n    try:\n        return graph.invoke(data, config=config)\n    except GraphRecursionError as e:\n        print(\"종료 조건/반복 제한 확인:\", e)\n    except InvalidUpdateError as e:\n        print(\"State 반환값/동시 업데이트 확인:\", e)\n    # 그 외 오류를 무조건 숨기지 않습니다.\n    return None\n\n# 사용 예: run_safely(graph, {\"answer\": \"\"})\n# graph는 앞 단계에서 생성한 그래프를 전달하세요.", "note": "GraphRecursionError → 무한 루프·종료 조건, InvalidUpdateError → 상태 업데이트 형태·병렬 업데이트, interrupt → 오류가 아니라 의도된 중단.", "q": "종합: 노드가 문자열을 반환해서 생긴 오류는?", "choices": ["GraphRecursionError", "InvalidUpdateError", "KeyboardInterrupt"], "answer": 1, "explain": "잘못된 State 업데이트는 InvalidUpdateError의 대표 사례입니다."}];
let current=0;
let unlocked=Number(localStorage.getItem('lg_errors_unlocked')||0);
if(!Number.isFinite(unlocked))unlocked=0;
unlocked=Math.max(0,Math.min(unlocked,steps.length-1));
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){const s=steps[current];document.querySelector('#tabs').innerHTML=steps.map((x,i)=>`<button class="tab ${current===i?'active':''}" ${i>unlocked?'disabled':''} onclick="go(${i})"><span class="num">${x.num}</span><span>${esc(x.title)}</span></button>`).join('');document.querySelector('#pane').innerHTML=`<div class="stage">STEP ${s.num} / 10</div><h2>${esc(s.title)}</h2><div class="desc">${esc(s.desc)}</div><div class="codewrap"><button class="copy" onclick="copyCode()">코드 복사</button><pre><code id="sample">${esc(s.code)}</code></pre></div><div class="note"><b>실습 포인트</b><div>${esc(s.note)}</div></div><section class="quiz"><h3>이해도 확인 ${s.num}</h3><p>${esc(s.q)}</p>${s.choices.map((x,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"> ${esc(x)}</label>`).join('')}<div class="buttons"><button class="primary" onclick="check()">정답 확인</button><button class="secondary" onclick="prev()">이전 단계</button><button class="secondary" id="next" onclick="next()" ${current>=unlocked?'disabled':''}>다음 단계 →</button></div><div id="feedback" class="feedback" aria-live="polite"></div></section>`;document.querySelector('#bar').style.width=((unlocked+1)/steps.length*100)+'%';document.querySelector('#count').textContent=`진행 가능: ${unlocked+1} / ${steps.length}`;}
function go(i){if(i<=unlocked){current=i;render();window.scrollTo(0,0)}}function prev(){go(Math.max(0,current-1))}function next(){go(Math.min(current+1,steps.length-1))}function check(){const v=document.querySelector('input[name="answer"]:checked');const f=document.querySelector('#feedback');if(!v){f.className='feedback bad';f.textContent='답을 선택해주세요.';return}const s=steps[current];if(Number(v.value)===s.answer){f.className='feedback ok';f.textContent='정답입니다! '+s.explain;if(current<steps.length-1){unlocked=Math.max(unlocked,current+1);localStorage.setItem('lg_errors_unlocked',String(unlocked));document.querySelector('#next').disabled=false;}else f.textContent+=' 모든 단계를 완료했습니다!';document.querySelector('#bar').style.width=((unlocked+1)/steps.length*100)+'%';document.querySelector('#count').textContent=`진행 가능: ${unlocked+1} / ${steps.length}`;document.querySelectorAll('.tab').forEach((el,i)=>el.disabled=i>unlocked)}else{f.className='feedback bad';f.textContent='다시 생각해보세요. '+s.explain}}
async function copyCode(){const code=steps[current].code;try{await navigator.clipboard.writeText(code);document.querySelector('.copy').textContent='복사 완료'}catch(e){const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();document.querySelector('.copy').textContent='복사 완료'}setTimeout(()=>{const b=document.querySelector('.copy');if(b)b.textContent='코드 복사'},1200)}render();
</script></body></html>
