<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LangChain ChatResult · ChatGeneration | 단계별 학습</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172334;font:15px/1.68 system-ui,-apple-system,"Malgun Gothic",sans-serif}header{background:#14213d;color:white;padding:22px max(24px,calc((100vw - 1200px)/2))}header small{color:#fda4af;font-weight:700;letter-spacing:.05em}header h1{margin:4px 0;font-size:25px}header p{margin:0;color:#cbd5e1}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1200px;margin:24px auto;padding:0 20px}.side,.panel{background:white;border:1px solid #e2e8f0;border-radius:14px}.side{padding:14px;align-self:start;position:sticky;top:16px}.side strong{display:block;padding:8px 10px}.tab{width:100%;text-align:left;background:white;border:0;padding:12px;border-radius:9px;font:inherit;cursor:pointer;color:#334155}.tab.active{background:#fff1f2;color:#be123c;font-weight:700}.tab:disabled{opacity:.42;cursor:not-allowed}.panel{padding:28px 32px;min-height:640px}.stepid{color:#e11d48;font-weight:800;font-size:13px}.panel h2{margin:2px 0 14px;font-size:25px}.desc{font-size:16px}.codewrap{position:relative;margin-top:22px}pre{overflow:auto;background:#101827;color:#e2e8f0;border-radius:11px;padding:22px;font:13px/1.65 Consolas,monospace;white-space:pre}button.copy{position:absolute;right:12px;top:12px;background:#334155;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer}.quiz{margin-top:24px;padding:20px;background:#fff7f8;border:1px solid #fecdd3;border-radius:12px}.quiz h3{margin:0 0 9px;font-size:17px}.opt{display:block;padding:10px 0;cursor:pointer}.opt input{margin-right:9px;accent-color:#e11d48}button.primary{background:#be123c;color:white;border:none;border-radius:8px;padding:11px 18px;cursor:pointer;font-weight:700}button.primary:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:24px;margin:8px 0;font-weight:700}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}.nav button{border:1px solid #cbd5e1;border-radius:8px;padding:9px 16px;background:white;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.progress{margin:8px 10px 14px;background:#e2e8f0;height:8px;border-radius:99px;overflow:hidden}.bar{height:100%;width:0%;background:#e11d48;transition:width .2s}.meta{color:#64748b;font-size:13px;padding:0 10px}.footer{margin-top:25px;border-top:1px solid #e2e8f0;padding-top:15px;color:#64748b;font-size:13px}a{color:#be123c}code.inline{background:#f1f5f9;padding:2px 4px;border-radius:4px}@media(max-width:700px){.shell{display:block;padding:0 12px}.side{position:static;margin-bottom:15px}.tabs{display:flex;overflow:auto}.tab{min-width:115px}.panel{padding:20px}.side strong{padding:3px 8px}header{padding:20px}}</style></head><body><header><small>부성순 · LANGCHAIN 기초 실습</small><h1>ChatResult · ChatGeneration 단계별 학습</h1><p>각 단계는 독립적으로 표시되며, 이해도 문제 정답 확인 후 다음 단계가 열립니다.</p></header><main class="shell"><aside class="side"><strong>학습 단계</strong><div class="meta" id="count"></div><div class="progress"><div id="bar" class="bar"></div></div><nav class="tabs" id="tabs" aria-label="학습 단계"></nav></aside><article class="panel"><div class="stepid" id="stepid"></div><h2 id="title"></h2><p class="desc" id="desc"></p><div class="codewrap"><button type="button" class="copy" id="copy">코드 복사</button><pre><code id="code"></code></pre></div><section class="quiz"><h3>이해도 확인</h3><p id="question"></p><div id="options"></div><button class="primary" id="check">정답 확인</button><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="nav"><button id="prev">← 이전 단계</button><button id="next">다음 단계 →</button></div><div class="footer">설치: <code class="inline">pip install -U langchain-core</code> · 실습에 OpenAI API 키 불필요.<br>공식 문서: <a href="https://reference.langchain.com/python/langchain-core/outputs/chat_result/ChatResult" target="_blank" rel="noopener">ChatResult</a> · <a href="https://reference.langchain.com/python/langchain-core/outputs/chat_generation/ChatGeneration" target="_blank" rel="noopener">ChatGeneration</a><br>참고: 학습 진행률은 이 브라우저의 로컬 저장소에 저장됩니다.</div></article></main><script>const STEPS=[{"n": "01", "title": "개념: 두 클래스의 관계", "desc": "ChatGeneration은 한 개의 생성 결과를, ChatResult는 한 번의 채팅 모델 호출에서 나온 생성 결과 목록을 감쌉니다.", "code": "from langchain_core.outputs import ChatResult, ChatGeneration\n\n# ChatGeneration: 답변 하나를 담는 객체\n# ChatResult: 답변 객체들의 리스트를 담는 컨테이너", "q": "ChatResult의 generations에는 무엇이 들어갈까요?", "options": ["문자열 하나", "ChatGeneration 객체들의 리스트", "HumanMessage만 저장"], "correct": 1, "why": "ChatResult.generations는 list[ChatGeneration]입니다."}, {"n": "02", "title": "AIMessage부터 이해하기", "desc": "ChatGeneration에 넣는 message는 대개 AIMessage입니다. 먼저 메시지 객체부터 만들어 봅니다.", "code": "from langchain_core.messages import AIMessage\n\nmsg = AIMessage(content=\"환불은 3일 내 처리됩니다.\")\nprint(msg.content)\nprint(type(msg).__name__)\n# 환불은 3일 내 처리됩니다.\n# AIMessage", "q": "AIMessage의 content에는 일반적으로 무엇이 담길까요?", "options": ["AI의 응답 내용", "그래프 노드 이름", "API 키"], "correct": 0, "why": "AIMessage는 AI가 보낸 메시지를 표현합니다."}, {"n": "03", "title": "ChatGeneration 생성", "desc": "ChatGeneration(message=...)으로 AI 응답 한 개를 감쌉니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatGeneration\n\ngen = ChatGeneration(\n    message=AIMessage(content=\"배송은 2~3일 걸립니다.\")\n)\nprint(gen.message.content)\nprint(gen.text)\n# 배송은 2~3일 걸립니다.\n# 배송은 2~3일 걸립니다.", "q": "gen.message는 어떤 종류의 값인가요?", "options": ["일반적인 정수", "메시지 객체", "파일 경로"], "correct": 1, "why": "message에는 보통 AIMessage 객체가 들어갑니다."}, {"n": "04", "title": "ChatResult 생성", "desc": "ChatResult는 generations 리스트를 받습니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatGeneration, ChatResult\n\ngen = ChatGeneration(message=AIMessage(content=\"환불 가능\"))\nresult = ChatResult(generations=[gen])\nprint(len(result.generations))\nprint(result.generations[0].message.content)\n# 1\n# 환불 가능", "q": "왜 generations=[gen]처럼 대괄호를 사용할까요?", "options": ["문자열로 바꾸기 위해", "여러 후보 응답을 리스트로 담기 위해", "API를 호출하기 위해"], "correct": 1, "why": "generations는 리스트 필드입니다."}, {"n": "05", "title": "결과 꺼내기: 인덱스", "desc": "generations는 리스트이므로 0번부터 접근합니다. 가장 많이 쓰는 경로는 result.generations[0].message.content입니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatGeneration, ChatResult\n\nresult = ChatResult(generations=[\n    ChatGeneration(message=AIMessage(content=\"첫 답변\"))\n])\n\nfirst = result.generations[0]\nprint(first.message.content)\n# 첫 답변", "q": "첫 응답 문자열을 가져오는 정확한 표현은?", "options": ["result.message", "result.generations[0].message.content", "result.content[0]"], "correct": 1, "why": "ChatResult → generations[0] → message → content 순서입니다."}, {"n": "06", "title": "후보 응답을 여러 개 담기", "desc": "ChatResult는 같은 프롬프트에 대해 여러 후보 생성 결과를 담을 수 있습니다. 이 예제는 후보를 직접 만들어 넣습니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatGeneration, ChatResult\n\nresult = ChatResult(generations=[\n    ChatGeneration(message=AIMessage(content=\"답변 A\")),\n    ChatGeneration(message=AIMessage(content=\"답변 B\")),\n])\n\nfor i, gen in enumerate(result.generations, start=1):\n    print(i, gen.message.content)\n# 1 답변 A\n# 2 답변 B", "q": "후보가 2개라면 len(result.generations)는?", "options": ["1", "2", "3"], "correct": 1, "why": "직접 추가한 ChatGeneration의 개수만큼 길이가 늘어납니다."}, {"n": "07", "title": "llm_output 메타데이터", "desc": "llm_output은 제공자별 부가 정보를 담는 선택적 딕셔너리입니다. 구조가 표준화되어 있지 않으므로 모델마다 다를 수 있습니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatGeneration, ChatResult\n\nresult = ChatResult(\n    generations=[ChatGeneration(message=AIMessage(content=\"완료\"))],\n    llm_output={\"demo_provider\": \"local\", \"demo_units\": 5}\n)\nprint(result.llm_output)\n# {'demo_provider': 'local', 'demo_units': 5}", "q": "llm_output에 대한 올바른 설명은?", "options": ["모든 모델에서 키가 동일하다", "선택적인 제공자별 부가 정보다", "항상 정수다"], "correct": 1, "why": "사용량 등은 실제 모델에서는 AIMessage의 표준화된 필드도 함께 확인하는 편이 안전합니다."}, {"n": "08", "title": "invoke() 결과와 차이", "desc": "ChatResult는 채팅 모델 내부 구현에 주로 쓰입니다. 일반적으로 model.invoke()의 결과는 ChatResult가 아니라 AIMessage입니다.", "code": "from langchain_core.language_models.fake_chat_models import GenericFakeChatModel\nfrom langchain_core.messages import AIMessage\n\nmodel = GenericFakeChatModel(\n    messages=iter([AIMessage(content=\"안녕하세요\")])\n)\nanswer = model.invoke(\"인사해 줘\")\nprint(type(answer).__name__)\nprint(answer.content)\n# AIMessage\n# 안녕하세요", "q": "일반적인 채팅 모델의 invoke() 반환값은?", "options": ["ChatResult만 반환한다", "AIMessage", "StateGraph"], "correct": 1, "why": "내부의 ChatResult에서 사용자-facing 호출 결과로 AIMessage가 반환됩니다."}, {"n": "09", "title": "직접 만드는 채팅 모델 _generate", "desc": "BaseChatModel을 상속해 커스텀 모델을 만들 때 _generate()가 ChatResult를 반환합니다. 아래는 API 없는 에코 모델입니다.", "code": "from typing import Any\nfrom langchain_core.language_models.chat_models import BaseChatModel\nfrom langchain_core.messages import AIMessage, BaseMessage\nfrom langchain_core.outputs import ChatResult, ChatGeneration\n\nclass EchoModel(BaseChatModel):\n    @property\n    def _llm_type(self) -> str:\n        return \"echo-demo\"\n\n    def _generate(\n        self,\n        messages: list[BaseMessage],\n        stop: list[str] | None = None,\n        run_manager: Any = None,\n        **kwargs: Any,\n    ) -> ChatResult:\n        text = \"에코: \" + str(messages[-1].content)\n        return ChatResult(generations=[\n            ChatGeneration(message=AIMessage(content=text))\n        ])\n\nmodel = EchoModel()\nprint(model.invoke(\"환불 문의\").content)\n# 에코: 환불 문의", "q": "커스텀 BaseChatModel의 _generate()가 반환해야 하는 것은?", "options": ["ChatResult", "문자열만", "HumanMessage"], "correct": 0, "why": "_generate()의 반환형은 ChatResult입니다. 반면 invoke()는 AIMessage를 반환합니다."}, {"n": "10", "title": "종합 실습: 출력 구조 비교", "desc": "ChatGeneration과 ChatResult를 직접 만들고, 별도로 FakeChatModel.invoke()의 결과와 비교해 봅니다.", "code": "from langchain_core.messages import AIMessage\nfrom langchain_core.outputs import ChatGeneration, ChatResult\nfrom langchain_core.language_models.fake_chat_models import GenericFakeChatModel\n\n# 직접 생성한 내부 결과 구조\nmsg = AIMessage(content=\"배송 완료\")\ngen = ChatGeneration(message=msg)\nresult = ChatResult(generations=[gen])\nprint(\"ChatResult:\", result.generations[0].message.content)\n\n# 일반 invoke() 호출의 반환 구조\nmodel = GenericFakeChatModel(messages=iter([msg]))\nresponse = model.invoke(\"배송 상태 알려줘\")\nprint(\"invoke():\", response.content)\nprint(\"반환 타입:\", type(response).__name__)\n# ChatResult: 배송 완료\n# invoke(): 배송 완료\n# 반환 타입: AIMessage", "q": "실무 애플리케이션에서 보통 바로 사용하는 응답 객체는?", "options": ["AIMessage", "ChatResult만 사용", "ChatGeneration만 사용"], "correct": 0, "why": "일반적인 모델 호출은 AIMessage를 중심으로 다룹니다. ChatResult와 ChatGeneration은 내부 구현이나 커스텀 모델 개발에서 중요합니다."}];const steps=STEPS;const storageKey='lc-chatresult-progress-v1';let done={};try{done=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}let current=0;const $=id=>document.getElementById(id);function allowed(i){return i===0||!!done[i-1]}function draw(){const s=steps[current];$('stepid').textContent='STEP '+s.n;$('title').textContent=s.title;$('desc').textContent=s.desc;$('code').textContent=s.code;$('question').textContent=s.q;$('options').innerHTML='';s.options.forEach((o,i)=>{const label=document.createElement('label');label.className='opt';const radio=document.createElement('input');radio.type='radio';radio.name='answer';radio.value=i;label.append(radio,document.createTextNode(o));$('options').append(label)});$('feedback').textContent=done[current]?'✓ 이 단계는 통과했습니다.':' ';$('feedback').style.color='#166534';$('next').disabled=!done[current]||current===steps.length-1;$('prev').disabled=current===0;$('next').textContent=current===steps.length-1?'학습 완료':'다음 단계 →';$('tabs').innerHTML='';steps.forEach((v,i)=>{const b=document.createElement('button');b.className='tab'+(i===current?' active':'');b.textContent=v.n+' '+v.title;b.disabled=!allowed(i);b.onclick=()=>{current=i;draw()};$('tabs').append(b)});const count=steps.filter((_,i)=>done[i]).length;$('count').textContent=count+' / '+steps.length+' 단계 완료';$('bar').style.width=count/steps.length*100+'%'}$('check').onclick=()=>{const el=document.querySelector('input[name=answer]:checked');if(!el){$('feedback').textContent='답을 선택해 주세요.';return}const s=steps[current];if(Number(el.value)===s.correct){done[current]=true;try{localStorage.setItem(storageKey,JSON.stringify(done))}catch(e){}draw();$('feedback').textContent='정답입니다! '+s.why}else{$('feedback').textContent='다시 생각해 보세요. '+s.why;$('feedback').style.color='#b91c1c'}};$('next').onclick=()=>{if(current<steps.length-1&&done[current]){current++;draw()}};$('prev').onclick=()=>{if(current>0){current--;draw()}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(steps[current].code);$('copy').textContent='복사 완료';setTimeout(()=>$('copy').textContent='코드 복사',1200)}catch(e){const t=document.createElement('textarea');t.value=steps[current].code;document.body.append(t);t.select();document.execCommand('copy');t.remove();$('copy').textContent='복사 완료'}};draw();</script></body></html>
